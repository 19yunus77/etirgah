<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ətirgah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F3EC; --paper:#FFFDF9; --ink:#1F1A17; --muted:#7A6F66; --line:#E6DED2;
  --accent:#6B2D3C; --accent-2:#8A3F51; --gold:#B08D57; --ok:#3F6B4A;
  --r:14px; --shadow:0 1px 2px rgba(31,26,23,.06),0 8px 24px rgba(31,26,23,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}

/* header */
header{position:sticky;top:0;z-index:20;background:rgba(247,243,236,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;height:68px}
.logo{font:italic 600 32px/1 "Cormorant Garamond",serif;color:var(--accent);letter-spacing:.5px;text-decoration:none}
.logo small{display:block;font:500 10px/1 Inter,sans-serif;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold);font-style:normal;margin-top:3px}
.search{flex:1;position:relative;max-width:560px}
.search input{width:100%;height:42px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:0 16px 0 40px;outline:none}
.search input:focus{border-color:var(--gold)}
.search svg{position:absolute;left:14px;top:12px;opacity:.5}
.langs{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--paper)}
.langs button{border:0;background:none;padding:7px 11px;font-size:12px;font-weight:600;color:var(--muted)}
.langs button.on{background:var(--ink);color:#fff}
.cartbtn{position:relative;border:0;background:var(--accent);color:#fff;height:42px;padding:0 16px;border-radius:999px;display:flex;align-items:center;gap:8px;font-weight:600}
.cartbtn .n{background:#fff;color:var(--accent);border-radius:999px;min-width:20px;height:20px;font-size:12px;display:grid;place-items:center;padding:0 6px}

/* hero */
.hero{padding:34px 0 10px}
.hero h1{font:500 40px/1.1 "Cormorant Garamond",serif;margin:0 0 8px}
.hero p{margin:0;color:var(--muted);max-width:640px}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:18px 0 8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 13px;font-size:13px;color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
select{height:34px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:0 12px;font-size:13px}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.count{margin-left:auto;color:var(--muted);font-size:13px}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;padding:12px 0 24px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s;cursor:pointer}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.ph{aspect-ratio:4/3;display:grid;place-items:center;position:relative}
.ph .mono{font:600 46px/1 "Cormorant Garamond",serif;color:rgba(255,255,255,.95);letter-spacing:1px}
.ph .fam{position:absolute;left:10px;bottom:10px;background:rgba(255,255,255,.88);color:var(--ink);font-size:11px;font-weight:600;border-radius:999px;padding:3px 9px}
.ph .g{position:absolute;right:10px;top:10px;background:rgba(0,0,0,.25);color:#fff;font-size:11px;font-weight:600;border-radius:999px;padding:3px 8px}
.cb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.brand{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--gold);font-weight:600}
.name{font:600 19px/1.2 "Cormorant Garamond",serif}
.notes{font-size:12.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.price{margin-top:auto;padding-top:8px;display:flex;align-items:baseline;justify-content:space-between}
.price b{font-size:16px}
.price span{font-size:12px;color:var(--muted)}
.more{display:block;margin:0 auto 50px;border:1px solid var(--ink);background:none;border-radius:999px;padding:10px 26px;font-weight:600}
.empty{padding:60px 0;text-align:center;color:var(--muted)}

/* modal + drawer */
.ov{position:fixed;inset:0;background:rgba(31,26,23,.45);z-index:40;display:none}
.ov.show{display:block}
.modal{position:fixed;z-index:50;left:50%;top:50%;transform:translate(-50%,-50%);width:min(760px,94vw);max-height:90vh;overflow:auto;background:var(--paper);border-radius:20px;display:none;box-shadow:0 30px 80px rgba(0,0,0,.25)}
.modal.show{display:block}
.mh{display:grid;grid-template-columns:240px 1fr}
.mh .ph{aspect-ratio:auto;height:100%;min-height:240px}
.mbody{padding:24px 26px}
.x{position:absolute;right:14px;top:12px;border:0;background:rgba(255,255,255,.9);width:34px;height:34px;border-radius:50%;font-size:20px;line-height:1;z-index:2}
.mbody .name{font-size:28px;margin:2px 0 6px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.tag{font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.pyr{display:grid;gap:8px;margin:14px 0}
.pyr div{display:grid;grid-template-columns:110px 1fr;gap:10px;font-size:13.5px}
.pyr dt{color:var(--muted)}
.desc{font-size:14.5px;margin:10px 0 0}
.nodata{background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:12px;color:var(--muted);font-size:13.5px}
.buy{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:18px;padding-top:16px}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:#fff}
.qty button{border:0;background:none;width:36px;height:38px;font-size:18px}
.qty input{width:56px;border:0;text-align:center;height:38px;outline:none}
.qty em{font-style:normal;color:var(--muted);font-size:13px;padding-right:12px}
.total{font-weight:600;font-size:18px}
.primary{border:0;background:var(--accent);color:#fff;border-radius:999px;padding:11px 22px;font-weight:600}
.primary:hover{background:var(--accent-2)}
.ghost{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 18px;font-weight:600}

.drawer{position:fixed;right:0;top:0;bottom:0;width:min(420px,100vw);background:var(--paper);z-index:50;transform:translateX(105%);transition:transform .25s,visibility .25s;visibility:hidden;overflow:auto}
.drawer.show{transform:none;visibility:visible;box-shadow:-20px 0 60px rgba(0,0,0,.15)}
.dh{position:sticky;top:0;background:var(--paper);z-index:1;display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}
.dh h3{margin:0;font:600 24px/1 "Cormorant Garamond",serif}
.db{padding:4px 20px}
.line{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:12px 0;border-bottom:1px solid var(--line)}
.line .nm{font-weight:600;font-size:14px}
.line .br{font-size:11px;color:var(--gold);letter-spacing:1px;text-transform:uppercase}
.line .rm{border:0;background:none;color:var(--muted);font-size:12px;text-decoration:underline;padding:0;justify-self:start}
.line .qty input{width:46px}
.line .qty button{width:30px;height:32px}
.line .qty input{height:32px}
.df{border-top:1px solid var(--line);padding:16px 20px;display:grid;gap:10px}
.df .sum{display:flex;justify-content:space-between;font-size:17px;font-weight:600}
.form{display:grid;gap:8px}
.form input,.form textarea{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;outline:none;width:100%}
.form input:focus,.form textarea:focus{border-color:var(--gold)}
.form textarea{min-height:60px;resize:vertical}
.err{color:#A33;font-size:13px}
.done{background:var(--bg);border-radius:12px;padding:14px;font-size:13.5px;white-space:pre-wrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.2s;z-index:60;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
footer{border-top:1px solid var(--line);padding:24px 0 40px;color:var(--muted);font-size:13px}

@media (max-width:720px){
  .bar{height:auto;flex-wrap:wrap;padding:10px 0;gap:10px}
  .search{order:3;flex-basis:100%;max-width:none}
  .hero h1{font-size:30px}
  .mh{grid-template-columns:1fr}
  .mh .ph{min-height:150px}
  .grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .name{font-size:17px}
  .ph .mono{font-size:34px}
  .count{flex-basis:100%;margin:0}
  .sep{display:none}
}
</style>
</head>

<header>
  <div class="wrap bar">
    <a class="logo" href="#" onclick="resetAll();return false">Ətirgah<small data-t="tag"></small></a>

      <input id="q" type="search" autocomplete="off">
    </label>
    <div class="langs" id="langs">

</header>

    <select id="season"></select>
    <select id="brand"></select>
    <select id="sort"></select>
    <span class="count" id="count"></span>
  </section>

  <section class="grid" id="grid"></section>
  <button class="more" id="more"></button>
</main>

<footer class="wrap" data-t="foot"></footer>

<div class="ov" id="ov"></div>
<div class="modal" id="modal"></div>
<aside class="drawer" id="drawer">
  <div class="dh"><h3 data-t="cart"></h3><button class="x" style="position:static" id="closeCart">×</button></div>
  <div class="db" id="lines"></div>

</aside>

oody"],"t":["berqamot, limon, portağal","бергамот, лимон, апельсин","bergamot, lemon, orange"],"h":["ud ağacı, dəri, hil","уд, кожа, кардамон","oud, leather, cardamom"],"b":["kəhrəba, səndəl ağacı, paçuli","амбра, сандал, пачули","amber, sandalwood, patchouli"],"s":["Payız–qış; gündüz və axşam","Осень–зима; день и вечер","Autumn–winter; day & evening"],"d":["Kişilər üçün odunsu ətir. Açılışda berqamot, limon və portağal, ürəyində ud ağacı və dəri, bazasında isə kəhrəba, səndəl ağacı və paçuli hiss olunur. Xüsusilə sərin havalarda yaxşıdır.","Древесный аромат для мужчин. Начало — бергамот, лимон и апельсин; в сердце — уд и кожа; в базе — амбра, сандал и пачули. Особенно хорош в прохладное время года.","Woody fragrance for men. It opens with bergamot, lemon and orange, reveals oud and leather in the heart and settles on amber, sandalwood and patchouli. Especially good in the cooler months."]},{"f":["Aromatik fujer","Ароматический фужерный","Aromatic Fougère"],"t":["qreypfrut, limon, berqamot","грейпфрут, лимон, бергамот","grapefruit, lemon, bergamot"],"h":["lavanda, ətirşah","лаванда, герань","lavender, geranium"],"b":["sidr, müşk, vetiver","кедр, мускус, ветивер","cedar, musk, vetiver"],"s":["Yaz–yay; gündüz","Весна–лето; день","Spring–summer; daytime"],"d":["Kişilər üçün aromatik fujer ətir. Açılışda qreypfrut, limon və berqamot, ürəyində lavanda və ətirşah, bazasında isə sidr, müşk və vetiver hiss olunur. Ən yaxşı yaz və yay aylarında, gündüz açılır.","Ароматический фужерный аромат для мужчин. Начало — грейпфрут, лимон и бергамот; в сердце — лаванда и герань; в базе — кедр, мускус и ветивер. Лучше всего раскрывается весной и летом, в дневное время.","Aromatic fougère fragrance for men. It opens with grapefruit, lemon and bergamot, reveals lavender and geranium in the heart and settles on cedar, musk and vetiver. At its best in spring and summer, during the day."]},{"f":["Şərq qurman","Восточный гурманский","Oriental Gourmand"],"t":["ananas, alma, limon","ананас, яблоко, лимон","pineapple, apple, lemon"],"h":["vanil, karamel","ваниль, карамель","vanilla, caramel"],"b":["kəhrəba, odunsu notlar","амбра, древесные ноты","amber, woody notes"],"s":["Payız–qış; gündüz və axşam","Осень–зима; день и вечер","Autumn–winter; day & evening"],"d":["Kişi və qadınlar üçün şərq qurman ətir. Açılışda ananas, alma və limon, ürəyində vanil və karamel, bazasında isə kəhrəba və odunsu notlar hiss olunur. Xüsusilə sərin havalarda yaxşıdır.","Восточный гурманский аромат для мужчин и женщин. Начало — ананас, яблоко и лимон; в сердце — ваниль и карамель; в базе — амбра и древесные ноты. Особенно хорош в прохладное время года.","Oriental gourmand fragrance for men and women. It opens with pineapple, apple and lemon, reveals vanilla and caramel in the heart and settles on amber and woody notes. Especially good in the cooler months."]},{"f":["Odunsu-kəhrəba","Древесный амбровый","Woody Amber"],"t":["alma, ağ istiot, lavanda, hil","яблоко, белый перец, лаванда, кардамон","apple, white pepper, lavender, cardamom"],"h":["süsən, sidr","ирис, кедр","iris, cedar"],"b":["kəhrəba, paçuli, odunsu notlar","амбра, пачули, древесные ноты","amber, patchouli, woody notes"],"s":["Payız–qış; gündüz və axşam","Осень–зима; день и вечер","Autumn–winter; day & evening"],"d":["İsti odunsu-kəhrəba ətri: xırtıldayan alma, hil və ağ istiot pudralı süsən və sidrə, sonra kəhrəba və paçuliyə keçir. Zərif və rahat — payız və qış üçün əla uniseks seçim.","Тёплый древесно-амбровый аромат: хрустящее яблоко, кардамон и белый перец переходят в пудровый ирис и кедр, а затем в амбру и пачули. Утончённый и уютный — отличный унисекс-вариант на осень и зиму.","A warm woody-amber scent: crisp apple, cardamom and white pepper lead into powdery iris and cedar, settling on amber and patchouli. Refined and cosy — a great unisex choice for autumn and winter."]},{"f":["Çiçəkli-meyvəli","Цветочный фруктовый","Floral Fruity"],"t":["limon, moruq","лимон, малина","lemon, raspberry"],"h":["qardeniya, jasmin, portağal çiçəyi","гардения, жасмин, цветок апельсина","gardenia, jasmine, orange blossom"],"b":["kəhrəba, müşk, vanil","амбра, мускус, ваниль","amber, musk, vanilla"],"s":["Bütün fəsillər; gündüz və axşam","Всесезонный; день и вечер","All seasons; day & evening"],"d":["Günəşli, \"qızıl\" ətir: şirəli moruq və limon yumşaq kəhrəba-vanil bazası üzərində ağ çiçəklərə — jasmin, qardeniya və portağal çiçəyinə açılır. İşıltılı və qadınsı, ab-havasına görə Lady Million-a yaxındır.","Солнечный «золотой» аромат: сочная малина и лимон раскрываются белыми цветами — жасмином, гарденией и цветком апельсина — на мягкой амброво-ванильной базе. Сияющий и женственный, по настроению близок к Lady Million.","A sunny, golden fragrance: juicy raspberry and lemon open onto white flowers — jasmine, gardenia and orange blossom — over a soft amber-vanilla base. Radiant and feminine, close in mood to Lady Million."]},{"f":["Odunsu-aromatik","Древесный ароматический","Woody Aromatic"],"t":["berqamot, limon, istiot","бергамот, лимон, перец","bergamot, lemon, pepper"],"h":["lavanda, ətirşah, jasmin","лаванда, герань, жасмин","lavender, geranium, jasmine"],"b":["kəhrəba, müşk, odunsu notlar","амбра, мускус, древесные ноты","amber, musk, woody notes"],"s":["Bütün fəsillər; gündüz və axşam","Всесезонный; день и вечер","All seasons; day & evening"],"d":["Kişi və qadınlar üçün odunsu-aromatik ətir. Açılışda berqamot, limon və istiot, ürəyində lavanda və ətirşah, bazasında isə kəhrəba, müşk və odunsu notlar hiss olunur. Universaldır: istənilən fəsildə, gündüz və axşam uyğundur.","Древесный ароматический аромат для мужчин и женщин. Начало — бергамот, лимон и перец; в сердце — лаванда и герань; в базе — амбра, мускус и древесные ноты. Универсален: подходит для любого сезона, днём и вечером.","Woody aromatic fragrance for men and women. It opens with bergamot, lemon and pepper, reveals lavender and geranium in the heart and settles on amber, musk and woody notes. Versatile: suits any season, day or evening."]},{"f":["Çiçəkli-odunsu","Цветочный древесный","Floral Woody"],"t":["çəhrayı istiot, pion","розовый перец, пион","pink pepper, peony"],"h":["qızılgül, freziya","роза, фрезия","rose, freesia"],"b":["müşk, odunsu notlar","мускус, древесные ноты","musk, woody notes"],"s":["Bütün fəsillər; gündüz və axşam","Всесезонный; день и вечер","All seasons; day & evening"],"d":["Qadınlar üçün çiçəkli-odunsu ətir. Açılışda çəhrayı istiot və pion, ürəyində qızılgül və freziya, bazasında isə müşk və odunsu notlar hiss olunur. Universaldır: istənilən fəsildə, gündüz və axşam uyğundur.","Цветочный древесный аромат для женщин. Начало — розовый перец и пион; в сердце — роза и фрезия; в базе — мускус и древесные ноты. Универсален: подходит для любого сезона, днём и вечером.","Floral woody fragrance for women. It opens with pink pepper and peony, reveals rose and freesia in the heart and settles on musk and woody notes. Versatile: suits any season, day or evening."]},{"f":["Aromatik dəniz","Ароматический водный","Aromatic Aquatic"],"t":["berqamot, mandarin, dəniz notları","бергамот, мандарин, морские ноты","bergamot, mandarin, sea notes"],"h":["sidr, siklamen, jasmin","кедр, цикламен, жасмин","cedar, cyclamen, jasmine"],"b":["müşk, kəhrəba, səndəl ağacı","мускус, амбра, сандал","musk, amber, sandalwood"],"s":["Yaz–yay; gündüz","Весна–лето; день","Spring–summer; daytime"],"d":["Kişilər üçün aromatik dəniz ətir. Açılışda berqamot, mandarin və dəniz notları, ürəyində sidr və siklamen, bazasında isə müşk, kəhrəba və səndəl ağacı hiss olunur. Ən yaxşı yaz və yay aylarında, gündüz açılır.","Ароматический водный аромат для мужчин. Начало — бергамот, мандарин и морские ноты; в сердце — кедр и цикламен; в базе — мускус, амбра и сандал. Лучше всего раскрывается весной и летом, в дневное время.","Aromatic aquatic fragrance for men. It opens with bergamot, mandarin and sea notes, reveals cedar and cyclamen in the heart and settles on musk, amber and sandalwood. At its best in spring and summer, during the day."]},{"f":["Odunsu-aromatik","Древесный ароматический","Woody Aromatic"],"t":["berqamot, alma, limon","бергамот, яблоко, лимон","bergamot, apple, lemon"],"h":["qızılgül, paçuli, tik ağacı","роза, пачули, тик","rose, patchouli, teak wood"],"b":["vanil, müşk, kəhrəba","ваниль, мускус, амбра","vanilla, musk, amber"],"s":["Bütün fəsillər; gündüz və axşam","Всесезонный; день и вечер","All seasons; day & evening"],"d":["Kişilər üçün odunsu-aromatik ətir. Açılışda berqamot, alma və limon, ürəyində qızılgül və paçuli, bazasında isə vanil, müşk və kəhrəba hiss olunur. Universaldır: istənilən fəsildə, gündüz və axşam uyğundur.","Древесный ароматический аромат для мужчин. Начало — бергамот, яблоко и лимон; в сердце — роза и пачули; в базе — ваниль, мускус и амбра. Универсален: подходит для любого сезона, днём и вечером.","Woody aromatic fragrance for men. It opens with bergamot, apple and lemon, reveals rose and patchouli in the heart and settles on vanilla, musk and amber. Versatile: suits any season, day or evening."]},{"f":["Şərq odunsu","Восточный древесный","Oriental Woody"],"t":["darçın, çəhrayı istiot, zirə","корица, розовый перец, кумин","cinnamon, pink pepper, cumin"],"h":["buxur, ud ağacı, qızılgül, ətirşah","ладан, уд, роза, герань","incense, oud, rose, geranium"],"b":["kəhrəba, səndəl ağacı, müşk","амбра, сандал, мускус","amber, sandalwood, musk"],"s":["Payız–qış; axşam","Осень–зима; вечер","Autumn–winter; evening"],"d":["Kişilər üçün şərq odunsu ətir. Açılışda darçın, çəhrayı istiot və zirə, ürəyində buxur və ud ağacı, bazasında isə kəhrəba, səndəl ağacı və müşk hiss olunur. Payız, qış və axşam çıxışları üçün idealdır.","Восточный древесный аромат для мужчин. Начало — корица, розовый перец и кумин; в сердце — ладан и уд; в базе — амбра, сандал и мускус. Идеален для осени, зимы и вечерних выходов.","Oriental woody fragrance for men. It opens with cinnamon, pink pepper and cumin, reveals incense and oud in the heart and settles on amber, sandalwood and musk. Ideal for autumn, winter and evenings out."]},{"f":["Kəhrəba-çiçəkli","Амбровый цветочный","Amber Floral"],"t":["armud, fındıq, buxur","груша, фундук, ладан","pear, hazelnut, frankincense"],"h":["qızılgül, osmantus","роза, османтус","rose, osmanthus"],"b":["səndəl ağacı, vanil, kəhrəba","сандал, ваниль, амбра","sandalwood, vanilla, amber"],"s":["Payız–qış; gündüz və axşam","Осень–зима; день и вечер","Autumn–winter; day & evening"],"d":["Kişi və qadınlar üçün kəhrəba-çiçəkli ətir. Açılışda armud, fındıq və buxur, ürəyində qızılgül və osmantus, bazasında isə səndəl ağacı, vanil və kəhrəba hiss olunur. Xüsusilə sərin havalarda yaxşıdır.","Амбровый цветочный аромат для мужчин и женщин. Начало — груша, фундук и ладан; в сердце — роза и османтус; в базе — сандал, ваниль и амбра. Особенно хорош в прохладное время года.","Amber floral fragrance for men and women. It opens with pear, hazelnut and frankincense, reveals rose and osmanthus in the heart and settles on sandalwood, vanilla and amber. Especially good in the cooler months."]},{"f":["Çiçəkli","Цветочный","Floral"],"t":["çəhrayı istiot","розовый перец","pink pepper"],"h":["tüberoza, qardeniya, inciçiçəyi","тубероза, гардения, ландыш","tuberose, gardenia, lily of the valley"],"b":["dəri, vetiver, müşk","кожа, ветивер, мускус","leather, vetiver, musk"],"s":["Bütün fəsillər; gündüz və axşam","Всесезонный; день и вечер","All seasons; day & evening"],"d":["Qadınlar üçün çiçəkli ətir. Açılışda çəhrayı istiot, ürəyində tüberoza və qardeniya, bazasında isə dəri, vetiver və müşk hiss olunur. Universaldır: istənilən fəsildə, gündüz və axşam uyğundur.","Цветочный аромат для женщин. Начало — розовый перец; в сердце — тубероза и гардения; в базе — кожа, ветивер и мускус. Универсален: подходит для любого сезона, днём и вечером.","Floral fragrance for women. It opens with pink pepper, reveals tuberose and gardenia in the heart and settles on leather, vetiver and musk. Versatile: suits any season, day or evening."]},{"f":["Odunsu-ədviyyatlı","Древесный пряный","Woody Spicy"],"t":["kəklikotu, yeni istiot, berqamot","орегано, душистый перец, бергамот","oregano, pimento, bergamot"],"h":["buxur, kəhrəba, labdanum, opopanaks","ладан, амбра, лабданум, опопанакс","incense, amber, labdanum, opoponax"],"b":["dəri, aqar ağacı, səndəl ağacı, paçuli","кожа, агаровое дерево, сандал, пачули","leather, agarwood, sandalwood, patchouli"],"s":["Payız–qış; axşam","Осень–зима; вечер","Autumn–winter; evening"],"d":["Kişilər üçün odunsu-ədviyyatlı ətir. Açılışda kəklikotu, yeni istiot və berqamot, ürəyində buxur və kəhrəba, bazasında isə dəri, aqar ağacı və səndəl ağacı hiss olunur. Payız, qış və axşam çıxışları üçün idealdır.","Древесный пряный аромат для мужчин. Начало — орегано, душистый перец и бергамот; в сердце — ладан и амбра; в базе — кожа, агаровое дерево и сандал. Идеален для осени, зимы и вечерних выходов.","Woody spicy fragrance for men. It opens with oregano, pimento and bergamot, reveals incense and amber in the heart and settles on leather, agarwood and sandalwood. Ideal for autumn, winter and evenings out."]},{"f":["Şərq odunsu","Восточный древесный","Oriental Woody"],"t":["böyürtkən, portağal, keşniş","ежевика, апельсин, кориандр","blackberry, orange, coriander"],"h":["buxur, qızılgül, bal, orxideya","ладан, роза, мёд, орхидея","incense, rose, honey, orchid"],"b":["palıd mamırı, aqar ağacı, mirra, müşk","дубовый мох, агаровое дерево, мирра, мускус","oakmoss, agarwood, myrrh, musk"],"s":["Payız–qış; axşam","Осень–зима; вечер","Autumn–winter; evening"],"d":["Kişilər üçün şərq odunsu ətir. Açılışda böyürtkən, portağal və keşniş, ürəyində buxur və qızılgül, bazasında isə palıd mamırı, aqar ağacı və mirra hiss olunur. Payız, qış və axşam çıxışları üçün idealdır.","Восточный древесный аромат для мужчин. Начало — ежевика, апельсин и кориандр; в сердце — ладан и роза; в базе — дубовый мох, агаровое дерево и мирра. Идеален для осени, зимы и вечерних выходов.","Oriental woody fragrance for men. rastlı və cazibədar: kakao və tonkanın tünd notları ilə ağ tüberoza və jasmin. Eyni zamanda həm incə, həm cəsur qadın üçün.","Контрастный и соблазнительный: белая тубероза и жасмин с тёмными нотами какао и тонки. Для женщины, которая одновременно нежная и дерзкая.","Contrasting and seductive: white tuberose and jasmine with dark notes of cocoa and tonka. For a woman who is both sweet and daring."]},{"f":["Çiçəkli","Цветочный","Floral"],"t":["pitahaya","питахайя","pitahaya"],"h":["pion, qərənfil","пион, гвоздика","peony, carnation"],"b":["vanil, müşk","ваниль, мускус","vanilla, musk"],"s":["Bütün fəsillər; gündüz və axşam","Всесезонный; день и вечер","All seasons; day & evening"],"d":["Qadınlar üçün çiçəkli ətir. Açılışda pitahaya, ürəyində pion və qərənfil, bazasında isə vanil və müşk hiss olunur. Universaldır: istənilən fəsildə, gündüz və axşam uyğundur.","Цветочный аромат для женщин. Начало — питахайя; в сердце — пион и гвоздика; в базе — ваниль и мускус. Универсален: подходит для любого сезона, днём и вечером.","Floral fragrance for women. It opens with pitahaya, reveals peony and carnation in the heart and settles on vanilla and musk. Versatile: suits any season, day or evening."]},{"f":["Şərq çiçəkli","Восточный цветочный","Oriental Floral"],"t":["liçi, qırmızı qarağat","личи, красная смородина","lychee, redcurrant"],"h":["qızılgül","роза","rose"],"b":["vanil, vetiver","ваниль, ветивер","vanilla, vetiver"],"s":["Payız–qış; gündüz və axşam","Осень–зима; день и вечер","Autumn–winter; day & evening"],"d":["Qadınlar üçün şərq çiçəkli ətir. Açılışda liçi və qırmızı qarağat, ürəyində qızılgül, bazasında isə vanil və vetiver hiss olunur. Xüsusilə sərin havalarda yaxşıdır.","Восточный цветочный аромат для женщин. Начало — личи и красная смородина; в сердце — роза; в базе — ваниль и ветивер. Особенно хорош в прохладное время года.","Oriental floral fragrance for women. It opens with lychee and redcurrant, reveals rose in the heart and settles on vanilla and vetiver. Especially good in the cooler months."]},{"f":["Odunsu-ədviyyatlı","Древесный пряный","Woody Spicy"],"t":["portağal, berqamot, yovşan","апельсин, бергамот, полынь","orange, bergamot, artemisia"],"h":["hil, zirə, süsən","кардамон, кумин, ирис","cardamom, cumin, iris"],"b":["sidr, vetiver, dəri","кедр, ветивер, кожа","cedar, vetiver, leather"],"s":["Bütün fəsillər; gündüz və axşam","Всесезонный; день и вечер","All seasons; day & evening"],"d":["Kişilər üçün odunsu-ədviyyatlı ətir. Açılışda portağal, berqamot və yovşan, ürəyində hil və zirə, bazasında isə sidr, vetiver və dəri hiss olunur. Universaldır: istənilən fəsildə, gündüz və axşam uyğundur.","Древесный пряный аромат для мужчин. Начало — апельсин, бергамот и полынь; в сердце — кардамон и кумин; в базе — кедр, ветивер и кожа. Универсален: подходит для любого сезона, днём и вечером.","Woody spicy fragrance for men. It opens with orange, bergamot and artemisia, reveals cardamom and cumin in the heart and settles on cedar, vetiver and leather. Versatile: suits any season, day or evening."]},{"f":["Çiçəkli şipr","Цветочный шипровый","Floral Chypre"],"t":["rəvənd, armud","ревень, груша","rhubarb, pear"],"h":["qardeniya","гардения","gardenia"],"b":["müşk, palıd mamırı","мускус, дубовый мох","musk, oakmoss"],"s":["Bütün fəsillər; gündüz və axşam","Всесезонный; день и вечер","All seasons; day & evening"],"d":["Qadınlar üçün çiçəkli şipr ətir. Açılışda rəvənd və armud, ürəyində qardeniya, bazasında isə müşk və palıd mamırı hiss olunur. Universaldır: istənilən fəsildə, gündüz və axşam uyğundur.","Цветочный шипровый аромат для женщин. Начало — ревень и груша; в сердце — гардения; в базе — мускус и дубовый мох. Универсален: подходит для любого сезона, днём и вечером.","Floral chypre fragrance for women. It opens with rhubarb and pear, reveals gardenia in the heart and settles on musk and oakmoss. Versatile: suits any season, day or evening."]},{"f":["Odunsu","Древесный","Woody"],"t":["qızılgül","роза","rose"],"h":["ud ağacı","уд","oud"],"b":["kəhrəba, odunsu notlar","амбра, древесные ноты","amber, woody notes"],"s":["Payız–qış; axşam","Осень–зима; вечер","Autumn–winter; evening"],"d":["Kişilər üçün odunsu ətir. Açılışda qızılgül, ürəyində ud ağacı, bazasında isə kəhrəba və odunsu notlar hiss olunur. Payız, qış və axşam çıxışları üçün idealdır.","Древесный аромат для мужчин. Начало — роза; в сердце — уд; в базе — амбра и древесные ноты. Идеален для осени, зимы и вечерних выходов.","Woody fragrance for men. It opens with rose, reveals oud in the heart and settles on amber and woody notes. Ideal for autumn, winter and evenings out."]},{"f":["Aromatik fujer","Ароматический фужерный","Aromatic Fougère"],"t":["mandarin, lavanda, nanə","мандарин, лаванда, мята","mandarin, lavender, mint"],"h":["keşniş, ziyirə","кориандр, тмин","coriander, caraway"],"b":["səndəl ağacı, palıd mamırı","сандал, дубовый мох","sandalwood, oakmoss"],"s":["Bütün fəsillər; gündüz və axşam","Всесезонный; день и вечер","All seasons; day & evening"],"d":["Kişilər üçün aromatik fujer ətir. Açılışda mandarin, lavanda və nanə, ürəyində keşniş və ziyirə, bazasında isə səndəl ağacı və palıd mamırı hiss olunur. Universaldır: istənilən fəsildə, gündüz və axşam uyğundur.","Ароматический фужерный аромат для мужчин. Начало — мандарин, лаванда и мята; в сердце — кориандр и тмин; в базе — сандал и дубовый мох. Универсален: подходит для любого сезона, днём и вечером.","Aromatic fougère fragrance for men. It opens with mandarin, lavender and mint, reveals coriander and caraway in the heart and settles on sandalwood and oakmoss. Versatile: suits any season, day or evening."]},{"f":["Çiçəkli","Цветочный","Floral"],"t":["berqamot, bənövşə","бергамот, фиалка","bergamot, violet"],"h":["jasmin, qızılgül, mimoza","жасмин, роза, мимоза","jasmine, rose, mimosa"],"b":["səndəl ağacı, müşk, sidr","сандал, мускус, кедр","sandalwood, musk, cedar"],"s":["Yaz–payız; gündüz","Весна–осень; день","Spring–autumn; daytime"],"d":["Qadınlar üçün çiçəkli ətir. Açılışda berqamot və bənövşə, ürəyində jasmin və qızılgül, bazasında isə səndəl ağacı, müşk və sidr hiss olunur. Yaz və payız üçün, xüsusən gündüz uyğundur.","Цветочный аромат для женщин. Начало — бергамот и фиалка; в сердце — жасмин и роза; в базе — сандал, мускус и кедр. Подходит для весны и осени, особенно днём.","Floral fragrance for women. It opens with bergamot and violet, reveals jasmine and rose in the heart and settles on sandalwood, musk and cedar. Suits spring and autumn, especially in the daytime."]},{"f":["Odunsu-ədviyyatlı","Древесный пряный","Woody Spicy"],"t":["limon, berqamot","лимон, бергамот","lemon, bergamot"],"h":["istiot, sidr","перец, кедр","pepper, cedar"],"b":["vanil, müşk, səndəl ağacı","ваниль, мускус, сандал","vanilla, musk, sandalwood"],"s":["Yaz–yay; gündüz","Весна–лето; день","Spring–summer; daytime"],"d":["Kişilər üçün odunsu-ədviyyatlı ətir. Açılışda limon və berqamot, ürəyində istiot və sidr, bazasında isə vanil, müşk və səndəl ağacı hiss olunur. Ən yaxşı yaz və yay aylarında, gündüz açılır.","Древесный пряный аромат для мужчин. Начало — лимон и бергамот; в сердце — перец и кедр; в базе — ваниль, мускус и сандал. Лучше всего раскрывается весной и летом, в дневное время.","Woody spicy fragrance for men. It opens with lemon and bergamot, reveals pepper and cedar in the heart and settles on vanilla, musk and sandalwood. At its best in spring and summer, during the day."]},{"f":["Odunsu-dəniz","Древесный водный","Woody Aquatic"],"t":["portağal, dəniz notları, aldehidlər","апельсин, морские ноты, альдегиды","orange, sea notes, aldehydes"],"h":["istiot, neroli, sidr","перец, нероли, кедр","pepper, neroli, cedar"],"b":["tonka paxlası, vanil, ağ müşk, kəhrəba","бобы тонка, ваниль, белый мускус, амбра","tonka bean, vanilla, white musk, amber"],"s":["Yaz–yay; gündüz","Весна–лето; день","Spring–summer; daytime"],"d":["Kişilər üçün odunsu-dəniz ətir. Açılışda portağal, dəniz notları və aldehidlər, ürəyində istiot və neroli, bazasında isə tonka paxlası, vanil və ağ müşk hiss olunur. Ən yaxşı yaz və yay aylarında, gündüz açılır.","Древесный водный аромат для мужчин. Начало — апельсин, морские ноты и альдегиды; в сердце — перец и нероли; в базе — бобы тонка, ваниль и белый мускус. Лучше всего раскрывается весной и летом, в дневное время.","Woody aquatic fragrance for men. It opens with orange, sea notes and aldehydes, reveals pepper and neroli in the heart and settles on tonka bean, vanilla and white musk. At its best in spring and summer, during the day."]},{"f":["Şərq ədviyyatlı","Восточный пряный","Oriental Spicy"],"t":["mandarin, limon, berqamot","мандарин, лимон, бергамот","mandarin, lemon, bergamot"],"h":["istiot, sidr, paçuli","перец, кедр, пачули","pepper, cedar, patchouli"],"b":["vanil, tonka paxlası, vetiver, labdanum","ваниль, бобы тонка, ветивер, лабданум","vanilla, tonka bean, vetiver, labdanum"],"s":["Bütün fəsillər; gündüz və axşam","Всесезонный; день и вечер","All seasons; day & evening"],"d":["Kişilər üçün şərq ədviyyatlı ətir. Açılışda mandarin, limon və berqamot, ürəyində istiot və sidr, bazasında isə vanil, tonka paxlası və vetiver hiss olunur. Universaldır: istənilən fəsildə, gündüz və axşam uyğundur.","Восточный пряный аромат для мужчин. Начало — мандарин, лимон и бергамот; в сердце — перец и кедр; в базе — ваниль, бобы тонка и ветивер. Универсален: подходит для любого сезона, днём и вечером.","Oriental spicy fragrance for men. It opens with mandarin, lemon and bergamot, reveals pepper and cedar in the heart and settles on vanilla, tonka bean and vetiver. Versatile: suits any season, day or evening."]},{"f":["Odunsu-aromatik","Древесный ароматический","Woody Aromatic"],"t":["qreypfrut, limon, nanə, çəhrayı istiot","грейпфрут, лимон, мята, розовый перец","grapefruit, lemon, mint, pink pepper"],"h":["zəncəfil, muskat qozu, jasmin, yemiş","имбирь, мускатный орех, жасмин, дыня","ginger, nutmeg, jasmine, melon"],"b":["buxur, sidr, səndəl ağacı, kəhrəba","ладан, кедр, сандал, амбра","incense, cedar, sandalwood, amber"],"s":["Bütün fəsillər; gündüz və axşam","Всесезонный; день и вечер","All seasons; day & evening"],"d":["Zərif odunsu-aromatik ətir: buxur və səndəl ağacından ibarət yumşaq baza üzərində sitrus təravəti. Ofisdə də, görüşdə də eyni dərəcədə yaxşıdır.","Элегантный древесно-ароматический парфюм: цитрусовая свежесть на мягкой базе из ладана и сандала. Одинаково хорош в офисе и на свидании.","Elegant woody-aromatic scent: citrus freshness over a smooth base of incense and sandalwood. Works equally well in the office and on a date."]},{"f":["Aromatik fujer","Ароматический фужерный","Aromatic Fougère"],"t":["lavanda, qreypfrut, limon","лаванда, грейпфрут, лимон","lavender, grapefruit, lemon"],"h":["ətirşah, qızılgül","герань, роза","geranium, rose"],"b":["səndəl ağacı, tonka paxlası, müşk","сандал, бобы тонка, мускус","sandalwood, tonka bean, musk"],"s":["Bütün fəsillər; gündüz və axşam","Всесезонный; день и вечер","All seasons; day & evening"],"d":["Kişilər üçün aromatik fujer ətir. Açılışda lavanda, qreypfrut və limon, ürəyində ətirşah və qızılgül, bazasında isə səndəl ağacı, tonka paxlası və müşk hiss olunur. Universaldır: istənilən fəsildə, gündüz və axşam uyğundur.","Ароматический фужерный аромат для мужчин. Начало — лаванда, грейпфрут и лимон; в сердце — герань и роза; в базе — сандал, бобы тонка и мускус. Универсален: подходит для любого сезона, днём и вечером.","Aromatic fougère fragrance for men. It opens with lavender, grapefruit and lemon, reveals geranium and rose in the heart and settles on sandalwood, tonka bean and musk. Versatile: suits any season, day or evening."]},{"f":["Çiçəkli şipr","Цветочный шипровый","Floral Chypre"],"t":["çəhrayı istiot, limon, ananas","розовый перец, лимон, ананас","pink pepper, lemon, pineapple"],"h":["jasmin, sümbül, süsən","жасмин, гиацинт, ирис","jasmine, hyacinth, iris"],"b":["paçuli, vanil, ağ müşk, vetiver","пачули, ваниль, белый мускус, ветивер","patchouli, vanilla, white musk, vetiver"],"s":["Bütün fəsillər; gündüz və axşam","Всесезонный; день и вечер","All seasons; day & evening"],"d":["İstiot çaları və yumşaq müşk-paçuli bazası olan parlaq, şux çiçəkli ətir. İstənilən yaşda qadınlar üçün gündəlik şən ətir.","Яркий, игривый цветочный аромат с ноткой перца и мягкой мускусно-пачулиевой базой. Жизнерадостный парфюм на каждый день для женщин любого возраста.","A bright, playful floral with a hint of pepper and a soft musky-patchouli base. A cheerful everyday fragrance for women of any age."]},{"f":["Çiçəkli şipr","Цветочный шипровый","Floral Chypre"],"t":["limon, sidr","лимон, кедр","lemon, cedar"],"h":["jasmin, su sümbülü, çəhrayı istiot","жасмин, водяной гиацинт, розовый перец","jasmine, water hyacinth, pink pepper"],"b":["tik ağacı, paçuli, vetiver, müşk","тик, пачули, ветивер, мускус","teak wood, patchouli, vetiver, musk"],"s":["Yaz–yay; gündüz","Весна–лето; день","Spring–summer; daytime"],"d":["Qadınlar üçün çiçəkli şipr ətir. Açılışda limon və sidr, ürəyində jasmin və su sümbülü, bazasında isə tik ağacı, paçuli və vetiver hiss olunur. Ən yaxşı yaz və yay aylarında, gündüz açılır.","Цветочный шипровый аромат для женщин. Начало — лимон и кедр; в сердце — жасмин и водяной гиацинт; в базе — тик, пачули и ветивер. Лучше всего раскрывается весной и летом, в дневное время.","Floral chypre fragrance for women. It opens with lemon and cedar, reveals jasmine and water hyacinth in the heart and settles on teak wood, patchouli and vetiver. At its best in spring and summer, during the day."]},{"f":["Çiçəkli-meyvəli","Цветочный фруктовый","Floral Fruity"],"t":["qreypfrut, heyva","грейпфрут, айва","grapefruit, quince"],"h":["sümbül, jasmin","гиацинт, жасмин","hyacinth, jasmine"],"b":["müşk, süsən, sidr, kəhrəba","мускус, ирис, кедр, амбра","musk, iris, cedar, amber"],"s":["Yaz–payız; gündüz","Весна–осень; день","Spring–autumn; daytime"],"d":["Qadınlar üçün çiçəkli-meyvəli ətir. Açılışda qreypfrut və heyva, ürəyində sümbül və jasmin, bazasında isə müşk, süsən və sidr hiss olunur. Yaz və payız üçün, xüsusən gündüz uyğundur.","Цветочный фруктовый аромат для женщин. Начало — грейпфрут и айва; в сердце — гиацинт и жасмин; в базе — мускус, ирис и кедр. Подходит для весны и осени, особенно днём.","Floral fruity fragrance for women. It opens with grapefruit and quince, reveals hyacinth and jasmine in the heart and settles on musk, iris and cedar. Suits spring and autumn, especially in the daytime."]},{"f":["Çiçəkli","Цветочный","Floral"],"t":["qreypfrut, qırmızı portağal","грейпфрут, красный апельсин","grapefruit, blood orange"],"h":["jasmin","жасмин","jasmine"],"b":["sidr, müşk, süsən","кедр, мускус, ирис","cedar, musk, iris"],"s":["Yaz–yay; gündüz","Весна–лето; день","Spring–summer; daytime"],"d":["Qadınlar üçün çiçəkli ətir. Açılışda qreypfrut və qırmızı portağal, ürəyində jasmin, bazasında isə sidr, müşk və süsən hiss olunur. Ən yaxşı yaz və yay aylarında, gündüz açılır.","Цветочный аромат для женщин. Начало — грейпфрут и красный апельсин; в сердце — жасмин; в базе — кедр, мускус и ирис. Лучше всего раскрывается весной и летом, в дневное время.","Floral fragrance for women. It opens with grapefruit and blood orange, reveals jasmine in the heart and settles on cedar, musk and iris. At its best in spring and summer, during the day."]},{"f":["Şərq ədviyyatlı","Восточный пряный","Oriental Spicy"],"t":["keşniş, mandarin, şaftalı","кориандр, мандарин, персик","coriander, mandarin, peach"],"h":["qızılgül, mixək, jasmin","роза, гвоздика (пряность), жасмин","rose, clove, jasmine"],"b":["labdanum, kəhrəba, vanil, səndəl ağacı","лабданум, амбра, ваниль, сандал","labdanum, amber, vanilla, sandalwood"],"s":["Payız–qış; axşam","Осень–зима; вечер","Autumn–winter; evening"],"d":["Qadınlar üçün şərq ədviyyatlı ətir. Açılışda keşniş, mandarin və şaftalı, ürəyində qızılgül və mixək, bazasında isə labdanum, kəhrəba və vanil hiss olunur. Payız, qış və axşam çıxışları üçün idealdır.","Восточный пряный аромат для женщин. Начало — кориандр, мандарин и персик  and jasmine in the heart and settles on patchouli, tonka bean and vanilla. Ideal for autumn, winter and evenings out."]},{"f":["Çiçəkli şipr","Цветочный шипровый","Floral Chypre"],"t":["qreypfrut, berqamot","грейпфрут, бергамот","grapefruit, bergamot"],"h":["qızılgül, jasmin, nərgiz","роза, жасмин, нарцисс","rose, jasmine, narcissus"],"b":["paçuli, tonka paxlası, səndəl ağacı, vanil","пачули, бобы тонка, сандал, ваниль","patchouli, tonka bean, sandalwood, vanilla"],"s":["Payız–qış; axşam","Осень–зима; вечер","Autumn–winter; evening"],"d":["Qadınlar üçün çiçəkli şipr ətir. Açılışda qreypfrut və berqamot, ürəyində qızılgül və jasmin, bazasında isə paçuli, tonka paxlası və səndəl ağacı hiss olunur. Payız, qış və axşam çıxışları üçün idealdır.","Цветочный шипровый аромат для женщин. Начало — грейпфрут и бергамот; в сердце — роза и жасмин; в базе — пачули, бобы тонка и сандал. Идеален для осени, зимы и вечерних выходов.","Floral chypre fragrance for women. It opens with grapefruit and bergamot, reveals rose and jasmine in the heart and settles on patchouli, tonka bean and sandalwood. Ideal for autumn, winter and evenings out."]},{"f":["Şərq odunsu","Восточный древесный","Oriental Woody"],"t":["portağal, neroli","апельсин, нероли","orange, neroli"],"h":["paçuli, süsən","пачули, ирис","patchouli, iris"],"b":["benzoin, buxur, kəhrəba","бензоин, ладан, амбра","benzoin, incense, amber"],"s":["Payız–qış; axşam","Осень–зима; вечер","Autumn–winter; evening"],"d":["Qadınlar üçün şərq odunsu ətir. Açılışda portağal və neroli, ürəyində paçuli və süsən, bazasında isə benzoin, buxur və kəhrəba hiss olunur. Payız, qış və axşam çıxışları üçün idealdır.","Восточный древесный аромат для женщин. Начало — апельсин и нероли; в сердце — пачули и ирис; в базе — бензоин, ладан и амбра. Идеален для осени, зимы и вечерних выходов.","Oriental woody fragrance for women. It opens with orange and neroli, reveals patchouli and iris in the heart and settles on benzoin, incense and amber. Ideal for au  лист фиалки; в сердце — карамель и жасмин; в базе — пачули и мускус. Универсален: подходит для любого сезона, днём и вечером.","Floral fruity fragrance for women. It opens with strawberry, mandarin and violet leaf, reveals caramel and jasmine in the heart and settles on patchouli and musk. Versatile: suits any season, day or evening."]},{"f":["Şərq odunsu","Восточный древесный","Oriental Woody"],"t":["labdanum","лабданум","labdanum"],"h":["qızılgül, paçuli","роза, пачули","rose, patchouli"],"b":["ud ağacı, səndəl ağacı","уд, сандал","oud, sandalwood"],"s":["Payız–qış; axşam","Осень–зима; вечер","Autumn–winter; evening"],"d":["Kişi və qadınlar üçün şərq odunsu ətir. Açılışda labdanum, ürəyində qızılgül və paçuli, bazasında isə ud ağacı və səndəl ağacı hiss olunur. Payız, qış və axşam çıxışları üçün idealdır.","Восточный древесный аромат для мужчин и женщин. Начало — лабданум; в сердце — роза и пачули; в базе — уд и сандал. Идеален для осени, зимы и вечерних выходов.","Oriental woody fragrance for men and women. It opens with labdanum, reveals rose and patchouli in the heart and settles on oud and sandalwood. Ideal for autumn, winter and evenings out."]},{"f":["Şərq ədviyyatlı","Восточный пряный","Oriental Spicy"],"t":["gavalı, keşniş, meşə giləmeyvələri","слива, кориандр, лесные ягоды","plum, coriander, wild berries"],"h":["tüberoza, darçın, bal, qızılgül","тубероза, корица, мёд, роза","tuberose, cinnamon, honey, rose"],"b":["kəhrəba, səndəl ağacı, vanil, müşk","амбра, сандал, ваниль, мускус","amber, sandalwood, vanilla, musk"],"s":["Payız–qış; axşam","Осень–зима; вечер","Autumn–winter; evening"],"d":["Qadınlar üçün şərq ədviyyatlı ətir. Açılışda gavalı, keşniş və meşə giləmeyvələri, ürəyində tüberoza və darçın, bazasında isə kəhrəba, səndəl ağacı və vanil hiss olunur. Payız, qış və axşam çıxışları üçün idealdır.","Восточный пряный аромат для женщин. Начало — слива, кориандр и лесные ягоды; в сердце — тубероза и корица; в базе — амбра, сандал и ваниль. Идеален для осени, зимы и вечерних выходов.","Oriental spicy fragrance for women. It opens with plum, coriander and wild berries, reveals tuberose and cinnamon in the heart and settles on amber, sandalwood and vanilla. Ideal for autumn, winter and evenings out."]},{"f":["Çiçəkli","Цветочный","Floral"],"t":["portağal, berqamot, jasmin","апельсин, бергамот, жасмин","orange, bergamot, jasmine"],"h":["qardeniya, portağal çiçəyi","гардения, цветок апельсина","gardenia, orange blossom"],"b":["kəhrəba, səndəl ağacı, müşk","амбра, сандал, мускус","amber, sandalwood, musk"],"s":["Bütün fəsillər; gündüz və axşam","Всесезонный; день и вечер","All seasons; day & evening"],"d":["Qadınlar üçün çiçəkli ətir. Açılışda portağal, berqamot və jasmin, ürəyində qardeniya və portağal çiçəyi, bazasında isə kəhrəba, səndəl ağacı və müşk hiss olunur. Universaldır: istənilən fəsildə, gündüz və axşam uyğundur.","Цветочный аромат для женщин. Начало — апельсин, бергамот и жасмин; в сердце — гардения и цветок апельсина; в базе — амбра, сандал и мускус. Универсален: подходит для любого сезона, днём и вечером.","Floral fragrance for women. It opens with orange, bergamot and jasmine, reveals gardenia and orange blossom in the heart and settles on amber, sandalwood and musk. Versatile: suits any season, day or evening."]},{"f":["Aromatik fujer","Ароматический фужерный","Aromatic Fougère"],"t":["berqamot, istiot","бергамот, перец","bergamot, pepper"],"h":["Siçuan istiotu, lavanda, çəhrayı istiot, ətirşah, vetiver, paçuli","сычуаньский перец, лаванда, розовый перец, герань, ветивер, пачули","Sichuan pepper, lavender, pink pepper, geranium, vetiver, patchouli"],"b":["ambroksan, sidr, labdanum","амброксан, кедр, лабданум","ambroxan, cedar, labdanum"],"s":["Bütün fəsillər; gündüz və axşam","Всесезонный; день и вечер","All seasons; day & evening"],"d":["Şirəli berqamotla açılan və güclü ambroksan izi buraxan cəsur, təravətli-ədviyyatlı ətir. Özünə inamlı kişi üçün universal seçim — hər gün və axşam üçün.","Смелый свежо-пряный аромат с сочным бергамотом в начале и мощным шлейфом амброксана. Универсальный выбор для уверенного мужчины — на каждый день и на вечер.","A bold, fresh-spicy fragrance with a juicy bergamot opening and a powerful ambroxan trail. A versatile choice for a confident man, for every day and evenings out."]},{"f":["Odunsu-aromatik","Древесный ароматический","Woody Aromatic"],"t":["berqamot","бергамот","bergamot"],"h":["lavanda, nanə","лаванда, мята","lavender, mint"],"b":["ambroksan, sidr","амброксан, кедр","ambroxan, cedar"],"s":["Bütün fəsillər; gündüz və axşam","Всесезонный; день и вечер","All seasons; day & evening"],"d":["Kişilər üçün odunsu-aromatik ətir. Açılışda berqamot, ürəyində lavanda və nanə, bazasında isə ambroksan və sidr hiss olunur. Universaldır: istənilən fəsildə, gündüz və axşam uyğundur.","Древесный ароматический аромат для мужчин. Начало — бергамот; в сердце — лаванда и мята; в базе — амброксан и кедр. Универсален: подходит для любого сезона, днём и вечером.","Woody aromatic fragrance for men. It opens with bergamot, reveals lavender and mint in the heart and settles on ambroxan and cedar. Versatile: suits any season, day or evening."]},{"f":["Kəhrəba-ədviyyatlı","Амбровый пряный","Amber Spicy"],"t":["qreypfrut, darçın, muskat qozu, hil","грейпфрут, корица, мускатный орех, кардамон","grapefruit, cinnamon, nutmeg, cardamom"],"h":["lavanda","лаванда","lavender"],"b":["biyan, səndəl ağacı, kəhrəba, paçuli","лакрица, сандал, амбра, пачули","licorice, sandalwood, amber, patchouli"],"s":["Payız–qış; axşam","Осень–зима; вечер","Autumn–winter; evening"],"d":["Kişilər üçün kəhrəba-ədviyyatlı ətir. Açılışda qreypfrut, darçın və muskat qozu, ürəyində lavanda, bazasında isə biyan, səndəl ağacı və kəhrəba hiss olunur. Payız, qış və axşam çıxışları üçün idealdır.","Амбровый пряный аромат для мужчин. Начало — грейпфрут, корица и мускатный орех; в сердце — лаванда; в базе — лакрица, сандал и амбра. Идеален для осени, зимы и вечерних выходов.","Amber spicy fragrance for men. It opens with grapefruit, cinnamon and nutmeg, reveals lavender in the heart and settles on licorice, sandalwood and amber. Ideal for autumn, winter and evenings out."]},{"f":["Sitrus-aromatik","Цитрусовый ароматический","Citrus Aromatic"],"t":["portağal, laym, qreypfrut","апельсин, лайм, грейпфрут","orange, lime, grapefruit"],"h":["nanə, zəncəfil","мята, имбирь","mint, ginger"],"b":["sidr, müşk","кедр, мускус","cedar, musk"],"s":["Yaz–yay; gündüz","Весна–лето; день","Spring–summer; daytime"],"d":["Kişilər üçün sitrus-aromatik ətir. Açılışda portağal, laym və qreypfrut, ürəyində nanə və zəncəfil, bazasında isə sidr və müşk hiss olunur. Ən yaxşı yaz və yay aylarında, gündüz açılır.","Цитрусовый ароматический аромат для мужчин. Начало — апельсин, лайм и грейпфрут; в сердце — мята и имбирь; в базе — кедр и мускус. Лучше всего раскрывается весной и летом, в дневное время.","Citrus aromatic fragrance for men. It opens with orange, lime and grapefruit, reveals mint and ginger in the heart and settles on cedar and musk. At its best in spring and summer, during the day."]},{"f":["Sitrus-meyvəli","Цитрусовый фруктовый","Citrus Fruity"],"t":["portağal, qreypfrut, berqamot","апельсин, грейпфрут, бергамот","orange, grapefruit, bergamot"],"h":["orxideya, freziya","орхидея, фрезия","orchid, freesia"],"b":["mimoza, müşk","мимоза, мускус","mimosa, musk"],"s":["Yaz–yay; gündüz","Весна–лето; день","Spring–summer; daytime"],"d":["Qadınlar üçün sitrus-meyvəli ətir. Açılışda portağal, qreypfrut və berqamot, ürəyində orxideya və freziya, bazasında isə mimoza və müşk hiss olunur. Ən yaxşı yaz və yay aylarında, gündüz açılır.","Цитрусовый фруктовый аромат для женщин. Начало — апельсин, грейпфрут и бергамот; в сердце — орхидея и фрезия; в базе — мимоза и мускус. Лучше всего раскрывается весной и летом, в дневное время.","Citrus fruity fragrance for women. It opens with orange, grapefruit and bergamot, reveals orchid and freesia in the heart and settles on mimosa and musk. y or evening."]},{"f":["Sitrus-aromatik","Цитрусовый ароматический","Citrus Aromatic"],"t":["berqamot, limon","бергамот, лимон","bergamot, lemon"],"h":["yaşıl çay, nanə","зелёный чай, мята","green tea, mint"],"b":["müşk, odunsu notlar","мускус, древесные ноты","musk, woody notes"],"s":["Yaz–yay; gündüz","Весна–лето; день","Spring–summer; daytime"],"d":["Kişi və qadınlar üçün sitrus-aromatik ətir. Açılışda berqamot və limon, ürəyində yaşıl çay və nanə, bazasında isə müşk və odunsu notlar hiss olunur. Ən yaxşı yaz və yay aylarında, gündüz açılır.","Цитрусовый ароматический аромат для мужчин и женщин. Начало — бергамот и лимон; в сердце — зелёный чай и мята; в базе — мускус и древесные ноты. Лучше всего раскрывается весной и летом, в дневное время.","Citrus aromatic fragrance for men and women. It opens with bergamot and lemon, reveals green tea and mint in the heart and settles on musk and woody notes. At its best in spring and summer, during the day."]},{"f":["Meyvəli şipr","Фруктовый шипровый","Fruity Chypre"],"t":["ananas, berqamot, qara qarağat, alma","ананас, бергамот, чёрная смородина, яблоко","pineapple, bergamot, blackcurrant, apple"],"h":["tozağacı, paçuli, jasmin, qızılgül","берёза, пачули, жасмин, роза","birch, patchouli, jasmine, rose"],"b":["müşk, palıd mamırı, ənbər, vanil","мускус, дубовый мох, серая амбра, ваниль","musk, oakmoss, ambergris, vanilla"],"s":["Bütün fəsillər; gündüz və axşam","Всесезонный; день и вечер","All seasons; day & evening"],"d":["Əfsanəvi \"uğur ətri\": tüstülü tozağacı akkordu və müşk bazası ilə şirəli ananas. İnamlı, xarizmatik və davamlı.","Легендарный «аромат успеха»: сочный ананас с дымным аккордом берёзы и мускусной базой. Уверенный, харизматичный и стойкий.","The legendary \"scent of success\": juicy pineapple with a smoky birch accord and a musky base. Confident, charismatic and long-lasting."]},{"f":["Sitrus-aromatik","Цитрусовый ароматический","Citrus Aromatic"],"t":["zəncəfil, mandarin, çəhrayı istiot","имбирь, мандарин  any season, day or evening."]},{"f":["Aromatik dəniz","Ароматический водный","Aromatic Aquatic"],"t":["limon, berqamot, istiot","лимон, бергамот, перец","lemon, bergamot, pepper"],"h":["dəniz notları, yemiş","морские ноты, дыня","sea notes, melon"],"b":["sidr, müşk, ənbər","кедр, мускус, серая амбра","cedar, musk, ambergris"],"s":["Yaz–yay; gündüz","Весна–лето; день","Spring–summer; daytime"],"d":["Kişilər üçün aromatik dəniz ətir. Açılışda limon, berqamot və istiot, ürəyində dəniz notları və yemiş, bazasında isə sidr, müşk və ənbər hiss olunur. Ən yaxşı yaz və yay aylarında, gündüz açılır.","Ароматический водный аромат для мужчин. Начало — лимон, бергамот и перец; в сердце — морские ноты и дыня; в базе — кедр, мускус и серая амбра. Лучше всего раскрывается весной и летом, в дневное время.","Aromatic aquatic fragrance for men. It opens with lemon, bergamot and pepper, reveals sea notes and melon in the heart and settles on cedar, musk and ambergris. At its best in spring and summer, during the day."]},{"f":["Aromatik fujer","Ароматический фужерный","Aromatic Fougère"],"t":["limon, bibərnanə","лимон, перечная мята","lemon, peppermint"],"h":["süsən, bənövşə yarpağı","ирис, лист фиалки","iris, violet leaf"],"b":["səndəl ağacı, ənbər","сандал, серая амбра","sandalwood, ambergris"],"s":["Yaz–yay; gündüz","Весна–лето; день","Spring–summer; daytime"],"d":["Kişilər üçün aromatik fujer ətir. Açılışda limon və bibərnanə, ürəyində süsən və bənövşə yarpağı, bazasında isə səndəl ağacı və ənbər hiss olunur. Ən yaxşı yaz və yay aylarında, gündüz açılır.","Ароматический фужерный аромат для мужчин. Начало — лимон и перечная мята; в сердце — ирис и лист фиалки; в базе — сандал и серая амбра. Лучше всего раскрывается весной и летом, в дневное время.","Aromatic fougère fragrance for men. It opens with lemon and peppermint, reveals iris and violet leaf in the heart and settles on sandalwood and ambergris. At its best in spring and summer, during the day."]},{"f":["Odunsu-aromatik","Древесный ароматический","Woody Aromatic"],"t":["berqamot, limon, qreypfrut","бергамот, лимон, грейпфрут","bergamot, lemon, grapefruit"],"h":["səndəl ağacı, ardıc","сандал, можжевельник","sandalwood, juniper"],"b":["müşk, ənbər, sidr","мускус, серая амбра, кедр","musk, ambergris, cedar"],"s":["Bütün fəsillər; gündüz və axşam","Всесезонный; день и вечер","All seasons; day & evening"],"d":["Kişilər üçün odunsu-aromatik ətir. Açılışda berqamot, limon və qreypfrut, ürəyində səndəl ağacı və ardıc, bazasında isə müşk, ənbər və sidr hiss olunur. Universaldır: istənilən fəsildə, gündüz və axşam uyğundur.","Древесный ароматический аромат для мужчин. Начало — бергамот, лимон и грейпфрут; в сердце — сандал и можжевельник; в базе — мускус, серая амбра и кедр. Универсален: подходит для любого сезона, днём и вечером.","Woody aromatic fragrance for men. It opens with bergamot, lemon and grapefruit, reveals sandalwood and juniper in the heart and settles on musk, ambergris and cedar. Versatile: suits any season, day or evening."]},{"f":["Sitrus-aromatik","Цитрусовый ароматический","Citrus Aromatic"],"t":["berqamot, limon, dəniz notları","бергамот, лимон, морские ноты","bergamot, lemon, sea notes"],"h":["süsən, ənbər","ирис, серая амбра","iris, ambergris"],"b":["müşk, səndəl ağacı","мускус, сандал","musk, sandalwood"],"s":["Yaz–yay; gündüz","Весна–лето; день","Spring–summer; daytime"],"d":["Kişi və qadınlar üçün sitrus-aromatik ətir. Açılışda berqamot, limon və dəniz notları, ürəyində süsən və ənbər, bazasında isə müşk və səndəl ağacı hiss olunur. Ən yaxşı yaz və yay aylarında, gündüz açılır.","Цитрусовый ароматический аромат для мужчин и женщин. Начало — бергамот, лимон и морские ноты; в сердце — ирис и серая амбра; в базе — мускус и сандал. Лучше всего раскрывается весной и летом, в дневное время.","Citrus aromatic fragrance for men and women. It opens with bergamot, lemon and sea notes, reveals iris and ambergris in the heart and settles on musk and sandalwood. At its best in spring and summer, during the day."]},{"f":["Çiçəkli","Цветочный","Floral"],"t":["portağal, düyü qabığı","апельсин, рисовая шелуха","orange, rice husk"],"h":["maqnoliya, nərgiz, jasmin, qızılgül","магнолия, нарцисс, жасмин, роза","magnolia, daffodil, jasmine, rose"],"b":["vanil, səndəl ağacı, ənbər","ваниль, сандал, серая амбра","vanilla, sandalwood, ambergris"],"s":["Yaz–payız; gündüz","Весна–осень; день","Spring–autumn; daytime"],"d":["Qadınlar üçün çiçəkli ətir. Açılışda portağal və düyü qabığı, ürəyində maqnoliya və nərgiz, bazasında isə vanil, səndəl ağacı və ənbər hiss olunur. Yaz və payız üçün, xüsusən gündüz uyğundur.","Цветочный аромат для женщин. Начало — апельсин и рисовая шелуха; в сердце — магнолия и нарцисс; в базе — ваниль, сандал и серая амбра. Подходит для весны и осени, особенно днём.","Floral fragrance for women. It opens with orange and rice husk, reveals magnolia and daffodil in the heart and settles on vanilla, sandalwood and ambergris. Suits spring and autumn, especially in the daytime."]},{"f":["Sitrus-aromatik","Цитрусовый ароматический","Citrus Aromatic"],"t":["neroli, limon, berqamot","нероли, лимон, бергамот","neroli, lemon, bergamot"],"h":["petitqren, lavanda","петитгрейн, лаванда","petitgrain, lavender"],"b":["ənbər, müşk","серая амбра, мускус","ambergris, musk"],"s":["Yaz–yay; gündüz","Весна–лето; день","Spring–summer; daytime"],"d":["Kişilər üçün sitrus-aromatik ətir. Açılışda neroli, limon və berqamot, ürəyində petitqren və lavanda, bazasında isə ənbər və müşk hiss olunur. Ən yaxşı yaz və yay aylarında, gündüz açılır.","Цитрусовый ароматический аромат для мужчин. Начало — нероли, лимон и бергамот; в сердце — петитгрейн и лаванда; в базе — серая амбра и мускус. Лучше всего раскрывается весной и летом, в дневное время.","Citrus aromatic fragrance for men. It opens with neroli, lemon and bergamot, reveals petitgrain and lavender in the heart and settles on ambergris and musk. At its best in spring and summer, during the day."]},{"f":["Odunsu- er months."]},{"f":["Sitrus-aromatik","Цитрусовый ароматический","Citrus Aromatic"],"t":["berqamot, mandarin","бергамот, мандарин","bergamot, mandarin"],"h":["yaşıl çay, qara qarağat","зелёный чай, чёрная смородина","green tea, blackcurrant"],"b":["müşk, səndəl ağacı, petitqren","мускус, сандал, петитгрейн","musk, sandalwood, petitgrain"],"s":["Yaz–yay; gündüz","Весна–лето; день","Spring–summer; daytime"],"d":["Kişi və qadınlar üçün sitrus-aromatik ətir. Açılışda berqamot və mandarin, ürəyində yaşıl çay və qara qarağat, bazasında isə müşk, səndəl ağacı və petitqren hiss olunur. Ən yaxşı yaz və yay aylarında, gündüz açılır.","Цитрусовый ароматический аромат для мужчин и женщин. Начало — бергамот и мандарин; в сердце — зелёный чай и чёрная смородина; в базе — мускус, сандал и петитгрейн. Лучше всего раскрывается весной и летом, в дневное время.","Citrus aromatic fragrance for men and women. It opens with bergamot and mandarin, reveals green tea and blackcurrant in the heart and settles on musk, sandalwood and petitgrain. At its best in spring and summer, during the day."]},{"f":["Şərq vanilli","Восточный ванильный","Oriental Vanilla"],"t":["limon, berqamot","лимон, бергамот","lemon, bergamot"],"h":["vanil","ваниль","vanilla"],"b":["müşk, odunsu notlar","мускус, древесные ноты","musk, woody notes"],"s":["Payız–qış; axşam","Осень–зима; вечер","Autumn–winter; evening"],"d":["Kişi və qadınlar üçün şərq vanilli ətir. Açılışda limon və berqamot, ürəyində vanil, bazasında isə müşk və odunsu notlar hiss olunur. Payız, qış və axşam çıxışları üçün idealdır.","Восточный ванильный аромат для мужчин и женщин. Начало — лимон и бергамот; в сердце — ваниль; в базе — мускус и древесные ноты. Идеален для осени, зимы и вечерних выходов.","Oriental vanilla fragrance for men and women. It opens with lemon and bergamot, reveals vanilla in the heart and settles on musk and woody notes. Ideal for autumn, winter and evenings out."]},{"f":["Aromatik-ədviyyatlı","Ароматический пряный","Aromatic ; день и вечер","All seasons; day & evening"],"d":["Kişilər üçün odunsu-aromatik ətir. Açılışda berqamot, limon və zəncəfil, ürəyində lavanda və portağal çiçəyi, bazasında isə ambroksan və vetiver hiss olunur. Universaldır: istənilən fəsildə, gündüz və axşam uyğundur.","Древесный ароматический аромат для мужчин. Начало — бергамот, лимон и имбирь; в сердце — лаванда и цветок апельсина; в базе — амброксан и ветивер. Универсален: подходит для любого сезона, днём и вечером.","Woody aromatic fragrance for men. It opens with bergamot, lemon and ginger, reveals lavender and orange blossom in the heart and settles on ambroxan and vetiver. Versatile: suits any season, day or evening."]},{"f":["Çiçəkli-meyvəli","Цветочный фруктовый","Floral Fruity"],"t":["limon, alma, sidr, zəngçiçəyi","лимон, яблоко, кедр, колокольчик","lemon, apple, cedar, bellflower"],"h":["bambuk, jasmin, ağ qızılgül","бамбук, жасмин, белая роза","bamboo, jasmine, white rose"],"b":["sidr, müşk, kəhrəba","кедр, мускус, амбра","cedar, musk, amber"],"s":["Yaz–yay; gündüz","Весна–лето; день","Spring–summer; daytime"],"d":["Siciliya limonu və xırtıldayan alma, yüngül çiçəkli ürək — Aralıq dənizi yayının ətri. Təravətli, yüngül və şən.","Сицилийский лимон и хрустящее яблоко с лёгким цветочным сердцем — аромат средиземноморского лета. Свежий, лёгкий и радостный.","Sicilian lemon and crisp apple with a light floral heart — the scent of a Mediterranean summer. Fresh, easy and joyful."]},{"f":["Çiçəkli","Цветочный","Floral"],"t":["liçi, şaftalı","личи, персик","lychee, peach"],"h":["qızılgül, pion","роза, пион","rose, peony"],"b":["müşk, vanil","мускус, ваниль","musk, vanilla"],"s":["Yaz–payız; gündüz","Весна–осень; день","Spring–autumn; daytime"],"d":["Qadınlar üçün çiçəkli ətir. Açılışda liçi və şaftalı, ürəyində qızılgül və pion, bazasında isə müşk və vanil hiss olunur. Yaz və payız üçün, xüsusən gündüz uyğundur.","Цветочный аромат для женщин. Начало — личи и персик; в сердце — роза и пион; в базе — мускус и ваниль. Подходит для весны и осени, особенно днём.","Floral fragrance for women. It opens with lychee and peach, reveals rose and peony in the heart and settles on musk and vanilla. Suits spring and autumn, especially in the daytime."]},{"f":["Şərq ədviyyatlı","Восточный пряный","Oriental Spicy"],"t":["qreypfrut, keşniş, reyhan","грейпфрут, кориандр, базилик","grapefruit, coriander, basil"],"h":["zəncəfil, hil, portağal çiçəyi","имбирь, кардамон, цветок апельсина","ginger, cardamom, orange blossom"],"b":["tütün yarpağı, kəhrəba, sidr","табачный лист, амбра, кедр","tobacco leaf, amber, cedar"],"s":["Payız–qış; axşam","Осень–зима; вечер","Autumn–winter; evening"],"d":["Kişilər üçün şərq ədviyyatlı ətir. Açılışda qreypfrut, keşniş və reyhan, ürəyində zəncəfil və hil, bazasında isə tütün yarpağı, kəhrəba və sidr hiss olunur. Payız, qış və axşam çıxışları üçün idealdır.","Восточный пряный аромат для мужчин. Начало — грейпфрут, кориандр и базилик; в сердце — имбирь и кардамон; в базе — табачный лист, амбра и кедр. Идеален для осени, зимы и вечерних выходов.","Oriental spicy fragrance for men. It opens with grapefruit, coriander and basil, reveals ginger and cardamom in the heart and settles on tobacco leaf, amber and cedar. Ideal for autumn, winter and evenings out."]},{"f":["Şərq çiçəkli","Восточный цветочный","Oriental Floral"],"t":["şaftalı, liçi, berqamot","персик, личи, бергамот","peach, lychee, bergamot"],"h":["zanbaq, jasmin, gavalı","лилия, жасмин, слива","lily, jasmine, plum"],"b":["vanil, kəhrəba, müşk","ваниль, амбра, мускус","vanilla, amber, musk"],"s":["Payız–qış; gündüz və axşam","Осень–зима; день и вечер","Autumn–winter; day & evening"],"d":["Qadınlar üçün şərq çiçəkli ətir. Açılışda şaftalı, liçi və berqamot, ürəyində zanbaq və jasmin, bazasında isə vanil, kəhrəba və müşk hiss olunur. Xüsusilə sərin havalarda yaxşıdır.","Восточный цветочный аромат для женщин. Начало — персик, личи и бергамот; в сердце — лилия и жасмин; в базе — ваниль, амбра и мускус. Особенно хорош в прохладное время года.","Oriental floral fragrance for women. It opens with peach, lychee and bergamot, reveals lily and jasmine in the heart and settles on vanilla, amber and musk. Especially good in the cooler months."]},{"f":["Şərq odunsu","Восточный древесный","Oriental Woody"],"t":["buxur","ладан","incense"],"h":["ud ağacı","уд","oud"],"b":["kəhrəba, odunsu notlar","амбра, древесные ноты","amber, woody notes"],"s":["Payız–qış; axşam","Осень–зима; вечер","Autumn–winter; evening"],"d":["Kişi və qadınlar üçün şərq odunsu ətir. Açılışda buxur, ürəyində ud ağacı, bazasında isə kəhrəba və odunsu notlar hiss olunur. Payız, qış və axşam çıxışları üçün idealdır.","Восточный древесный аромат для мужчин и женщин. Начало — ладан; в сердце — уд; в базе — амбра и древесные ноты. Идеален для осени, зимы и вечерних выходов.","Oriental woody fragrance for men and women. It opens with incense, reveals oud in the heart and settles on amber and woody notes. Ideal for autumn, winter and evenings out."]},{"f":["Çiçəkli-meyvəli","Цветочный фруктовый","Floral Fruity"],"t":["xiyar, qreypfrut, maqnoliya, alma","огурец, грейпфрут, магнолия, яблоко","cucumber, grapefruit, magnolia, apple"],"h":["tüberoza, bənövşə, qızılgül, inciçiçəyi","тубероза, фиалка, роза, ландыш","tuberose, violet, rose, lily of the valley"],"b":["səndəl ağacı, kəhrəba, müşk","сандал, амбра, мускус","sandalwood, amber, musk"],"s":["Yaz–payız; gündüz","Весна–осень; день","Spring–autumn; daytime"],"d":["Qadınlar üçün çiçəkli-meyvəli ətir. Açılışda xiyar, qreypfrut və maqnoliya, ürəyində tüberoza və bənövşə, bazasında isə səndəl ağacı, kəhrəba və müşk hiss olunur. Yaz və payız üçün, xüsusən gündüz uyğundur.","Цветочный фруктовый аромат для женщин. Начало — огурец, грейпфрут и магнолия; в сердце — тубероза и фиалка; в базе — сандал, амбра и мускус. Подходит для весны и осени, особенно днём.","Floral fruity fragrance for women. It opens with cucumber, grapefruit and magnolia, reveals tuberose and violet in the h
