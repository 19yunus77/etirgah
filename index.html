 və qreypfrut, ürəyində portağal çiçəyi, bazasında isə vetiver və müşk hiss olunur. Ən yaxşı yaz və yay aylarında, gündüz açılır.","Цитрусовый ароматический аромат для мужчин и женщин. Начало — бергамот и грейпфрут; в сердце — цветок апельсина; в базе — ветивер и мускус. Лучше всего раскрывается весной и летом, в дневное время.","Citrus aromatic fragrance for men and women. It opens with bergamot and grapefruit, reveals orange blossom in the heart and settles on vetiver and musk. At its best in spring and summer, during the day."]},{"f":["Çiçəkli","Цветочный","Floral"],"t":["zanbaq","лилия","lily"],"h":["jasmin, tüberoza","жасмин, тубероза","jasmine, tuberose"],"b":["vanil, müşk","ваниль, мускус","vanilla, musk"],"s":["Bütün fəsillər; gündüz və axşam","Всесезонный; день и вечер","All seasons; day & evening"],"d":["Qadınlar üçün çiçəkli ətir. Açılışda zanbaq, ürəyində jasmin və tüberoza, bazasında isə vanil və müşk hiss olunur. Universaldır: istənilən fəsildə, gündüz və axşam uyğundur.","Цветочный аромат для женщин. Начало — лилия; в сердце — жасмин и тубероза; в базе — ваниль и мускус. Универсален: подходит для любого сезона, днём и вечером.","Floral fragrance for women. It opens with lily, reveals jasmine and tuberose in the heart and settles on vanilla and musk. Versatile: suits any season, day or evening."]},{"f":["Odunsu","Древесный","Woody"],"t":["hil, bənövşə","кардамон, фиалка","cardamom, violet"],"h":["süsən, ambroks","ирис, амброкс","iris, ambrox"],"b":["səndəl ağacı, sidr, dəri","сандал, кедр, кожа","sandalwood, cedar, leather"],"s":["Bütün fəsillər; gündüz və axşam","Всесезонный; день и вечер","All seasons; day & evening"],"d":["Kişilər üçün odunsu ətir. Açılışda hil və bənövşə, ürəyində süsən və ambroks, bazasında isə səndəl ağacı, sidr və dəri hiss olunur. Universaldır: istənilən fəsildə, gündüz və axşam uyğundur.","Древесный аромат для мужчин. Начало — кардамон и фиалка; в сердце — ирис и амброкс; в базе — сандал, кедр и кожа. Универсален: подходит для любого сезона, днём и вечером.","Woody fragrance for men. It opens with cardamom and violet, reveals iris and ambrox in the heart and settles on sandalwood, cedar and leather. Versatile: suits any season, day or evening."]},{"f":["Sitrus-aromatik","Цитрусовый ароматический","Citrus Aromatic"],"t":["portağal, mandarin, berqamot","апельсин, мандарин, бергамот","orange, mandarin, bergamot"],"h":["zəncəfil","имбирь","ginger"],"b":["ənbər","серая амбра","ambergris"],"s":["Yaz–yay; gündüz","Весна–лето; день","Spring–summer; daytime"],"d":["Kişi və qadınlar üçün sitrus-aromatik ətir. Açılışda portağal, mandarin və berqamot, ürəyində zəncəfil, bazasında isə ənbər hiss olunur. Ən yaxşı yaz və yay aylarında, gündüz açılır.","Цитрусовый ароматический аромат для мужчин и женщин. Начало — апельсин, мандарин и бергамот; в сердце — имбирь; в базе — серая амбра. Лучше всего раскрывается весной и летом, в дневное время.","Citrus aromatic fragrance for men and women. It opens with orange, mandarin and bergamot, reveals ginger in the heart and settles on ambergris. At its best in spring and summer, during the day."]},{"f":["Sitrus-aromatik","Цитрусовый ароматический","Citrus Aromatic"],"t":["sitron, berqamot, portağal","цитрон, бергамот, апельсин","citron, bergamot, orange"],"h":["zəncəfil, darçın, neroli","имбирь, корица, нероли","ginger, cinnamon, neroli"],"b":["qara çay, ambroksan, qvayak ağacı","чёрный чай, амброксан, гваяковое дерево","black tea, ambroxan, guaiac wood"],"s":["Yaz–yay; gündüz","Весна–лето; день","Spring–summer; daytime"],"d":["Kişilər üçün sitrus-aromatik ətir. Açılışda sitron, berqamot və portağal, ürəyində zəncəfil və darçın, bazasında isə qara çay, ambroksan və qvayak ağacı hiss olunur. Ən yaxşı yaz və yay aylarında, gündüz açılır.","Цитрусовый ароматический аромат для мужчин. Начало — цитрон, бергамот и апельсин; в сердце — имбирь и корица; в базе — чёрный чай, амброксан и гваяковое дерево. Лучше всего раскрывается весной и летом, в дневное время.","Citrus aromatic fragrance for men. It opens with citron, bergamot and orange, reveals ginger and cinnamon in the heart and settles on black tea, ambroxan and guaiac wood. At its best in spring and summer, during the day."]},{"f":["Sitrus-aromatik","Цитрусовый ароматический","Citrus Aromatic"],"t":["qreypfrut, zəncəfil","грейпфрут, имбирь","grapefruit, ginger"],"h":["adaçayı, ətirşah","шалфей, герань","sage, geranium"],"b":["ambroksan, labdanum","амброксан, лабданум","ambroxan, labdanum"],"s":["Yaz–yay; gündüz","Весна–лето; день","Spring–summer; daytime"],"d":["Kişilər üçün sitrus-aromatik ətir. Açılışda qreypfrut və zəncəfil, ürəyində adaçayı və ətirşah, bazasında isə ambroksan və labdanum hiss olunur. Ən yaxşı yaz və yay aylarında, gündüz açılır.","Цитрусовый ароматический аромат для мужчин. Начало — грейпфрут и имбирь; в сердце — шалфей и герань; в базе — амброксан и лабданум. Лучше всего раскрывается весной и летом, в дневное время.","Citrus aromatic fragrance for men. It opens with grapefruit and ginger, reveals sage and geranium in the heart and settles on ambroxan and labdanum. At its best in spring and summer, during the day."]},{"f":["Sitrus-aromatik","Цитрусовый ароматический","Citrus Aromatic"],"t":["mandarin, berqamot","мандарин, бергамот","mandarin, bergamot"],"h":["istiot, muskat qozu","перец, мускатный орех","pepper, nutmeg"],"b":["vetiver","ветивер","vetiver"],"s":["Yaz–yay; gündüz","Весна–лето; день","Spring–summer; daytime"],"d":["Kişi və qadınlar üçün sitrus-aromatik ətir. Açılışda mandarin və berqamot, ürəyində istiot və muskat qozu, bazasında isə vetiver hiss olunur. Ən yaxşı yaz və yay aylarında, gündüz açılır.","Цитрусовый ароматический аромат для мужчин и женщин. Начало — мандарин и бергамот; в сердце — перец и мускатный орех; в базе — ветивер. Лучше всего раскрывается весной и летом, в дневное время.","Citrus aromatic fragrance for men and women. It opens with mandarin and bergamot, reveals pepper and nutmeg in the heart and settles on vetiver. At its best in spring and summer, during the day."]},{"f":["Şərq odunsu","Восточный древесный","Oriental Woody"],"t":["moruq","малина","raspberry"],"h":["ud ağacı, qızılgül, ətirşah","уд, роза, герань","oud, rose, geranium"],"b":["buxur, benzoin, kəhrəba","ладан, бензоин, амбра","incense, benzoin, amber"],"s":["Payız–qış; axşam","Осень–зима; вечер","Autumn–winter; evening"],"d":["Kişi və qadınlar üçün şərq odunsu ətir. Açılışda moruq, ürəyində ud ağacı və qızılgül, bazasında isə buxur, benzoin və kəhrəba hiss olunur. Payız, qış və axşam çıxışları üçün idealdır.","Восточный древесный аромат для мужчин и женщин. Начало — малина; в сердце — уд и роза; в базе — ладан, бензоин и амбра. Идеален для осени, зимы и вечерних выходов.","Oriental woody fragrance for men and women. It opens with raspberry, reveals oud and rose in the heart and settles on incense, benzoin and amber. Ideal for autumn, winter and evenings out."]},{"f":["Odunsu","Древесный","Woody"],"t":["berqamot","бергамот","bergamot"],"h":["süsən","ирис","iris"],"b":["vetiver, paçuli","ветивер, пачули","vetiver, patchouli"],"s":["Bütün fəsillər; gündüz və axşam","Всесезонный; день и вечер","All seasons; day & evening"],"d":["Kişilər üçün odunsu ətir. Açılışda berqamot, ürəyində süsən, bazasında isə vetiver və paçuli hiss olunur. Universaldır: istənilən fəsildə, gündüz və axşam uyğundur.","Древесный аромат для мужчин. Начало — бергамот; в сердце — ирис; в базе — ветивер и пачули. Универсален: подходит для любого сезона, днём и вечером.","Woody fragrance for men. It opens with bergamot, reveals iris in the heart and settles on vetiver and patchouli. Versatile: suits any season, day or evening."]},{"f":["Sitrus-aromatik","Цитрусовый ароматический","Citrus Aromatic"],"t":["laym, nanə","лайм, мята","lime, mint"],"h":["mimoza, qara qarağat","мимоза, чёрная смородина","mimosa, blackcurrant"],"b":["müşk","мускус","musk"],"s":["Yaz–yay; gündüz","Весна–лето; день","Spring–summer; daytime"],"d":["Kişi və qadınlar üçün sitrus-aromatik ətir. Açılışda laym və nanə, ürəyində mimoza və qara qarağat, bazasında isə müşk hiss olunur. Ən yaxşı yaz və yay aylarında, gündüz açılır.","Цитрусовый ароматический аромат для мужчин и женщин. Начало — лайм и мята; в сердце — мимоза и чёрная смородина; в базе — мускус. Лучше всего раскрывается весной и летом, в дневное время.","Citrus aromatic fragrance for men and women. It opens with lime and mint, reveals mimosa and blackcurrant in the heart and settles on musk. At its best in spring and summer, during the day."]},{"f":["Sitrus-aromatik","Цитрусовый ароматический","Citrus Aromatic"],"t":["berqamot, limon","бергамот, лимон","bergamot, lemon"],"h":["inciçiçəyi","ландыш","lily of the valley"],"b":["müşk, odunsu notlar","мускус, древесные ноты","musk, woody notes"],"s":["Yaz–yay; gündüz","Весна–лето; день","Spring–summer; daytime"],"d":["Kişi və qadınlar üçün sitrus-aromatik ətir. Açılışda berqamot və limon, ürəyində inciçiçəyi, bazasında isə müşk və odunsu notlar hiss olunur. Ən yaxşı yaz və yay aylarında, gündüz açılır.","Цитрусовый ароматический аромат для мужчин и женщин. Начало — бергамот и лимон; в сердце — ландыш; в базе — мускус и древесные ноты. Лучше всего раскрывается весной и летом, в дневное время.","Citrus aromatic fragrance for men and women. It opens with bergamot and lemon, reveals lily of the valley in the heart and settles on musk and woody notes. At its best in spring and summer, during the day."]},{"f":["Kəhrəba-çiçəkli","Амбровый цветочный","Amber Floral"],"t":["zəfəran, jasmin","шафран, жасмин","saffron, jasmine"],"h":["kəhrəba ağacı, ənbər","амбровое дерево, серая амбра","amberwood, ambergris"],"b":["küknar qatranı, sidr","смола пихты, кедр","fir resin, cedar"],"s":["Bütün fəsillər; gündüz və axşam","Всесезонный; день и вечер","All seasons; day & evening"],"d":["Zəfəran, jasmin və kristal kimi odunsu izlə ikonik, havadar kəhrəba ətri. Uzaqdan tanınır və inanılmaz dərəcədə davamlıdır.","Культовый воздушно-амбровый аромат с шафраном, жасмином и кристальным древесным шлейфом. Узнаётся издалека и невероятно стоек.","An iconic airy-amber scent with saffron, jasmine and a crystalline woody trail. Recognisable from a distance and incredibly long-lasting."]},{"f":["Şərq kəhrəba","Восточный амбровый","Oriental Amber"],"t":["sistus","ладанник","cistus"],"h":["benzoin, tonka paxlası","бензоин, бобы тонка","benzoin, tonka bean"],"b":["vanil, kəhrəba","ваниль, амбра","vanilla, amber"],"s":["Payız–qış; axşam","Осень–зима; вечер","Autumn–winter; evening"],"d":["Kişi və qadınlar üçün şərq kəhrəba ətir. Açılışda sistus, ürəyində benzoin və tonka paxlası, bazasında isə vanil və kəhrəba hiss olunur. Payız, qış və axşam çıxışları üçün idealdır.","Восточный амбровый аромат для мужчин и женщин. Начало — ладанник; в сердце — бензоин и бобы тонка; в базе — ваниль и амбра. Идеален для осени, зимы и вечерних выходов.","Oriental amber fragrance for men and women. It opens with cistus, reveals benzoin and tonka bean in the heart and settles on vanilla and amber. Ideal for autumn, winter and evenings out."]},{"f":["Şərq odunsu","Восточный древесный","Oriental Woody"],"t":["bənövşə","фиалка","violet"],"h":["qızılgül, ud ağacı","роза, уд","rose, oud"],"b":["vanil, benzoin","ваниль, бензоин","vanilla, benzoin"],"s":["Payız–qış; axşam","Осень–зима; вечер","Autumn–winter; evening"],"d":["Kişilər üçün şərq odunsu ətir. Açılışda bənövşə, ürəyində qızılgül və ud ağacı, bazasında isə vanil və benzoin hiss olunur. Payız, qış və axşam çıxışları üçün idealdır.","Восточный древесный аромат для мужчин. Начало — фиалка; в сердце — роза и уд; в базе — ваниль и бензоин. Идеален для осени, зимы и вечерних выходов.","Oriental woody fragrance for men. It opens with violet, reveals rose and oud in the heart and settles on vanilla and benzoin. Ideal for autumn, winter and evenings out."]},{"f":["Şərq odunsu","Восточный древесный","Oriental Woody"],"t":["zəfəran, çarxıfələk meyvəsi","шафран, маракуйя","saffron, passion fruit"],"h":["qızılgül, dəri","роза, кожа","rose, leather"],"b":["ud ağacı, paçuli","уд, пачули","oud, patchouli"],"s":["Payız–qış; axşam","Осень–зима; вечер","Autumn–winter; evening"],"d":["Kişi və qadınlar üçün şərq odunsu ətir. Açılışda zəfəran və çarxıfələk meyvəsi, ürəyində qızılgül və dəri, bazasında isə ud ağacı və paçuli hiss olunur. Payız, qış və axşam çıxışları üçün idealdır.","Восточный древесный аромат для мужчин и женщин. Начало — шафран и маракуйя; в сердце — роза и кожа; в базе — уд и пачули. Идеален для осени, зимы и вечерних выходов.","Oriental woody fragrance for men and women. It opens with saffron and passion fruit, reveals rose and leather in the heart and settles on oud and patchouli. Ideal for autumn, winter and evenings out."]},{"f":["Şərq qurman","Восточный гурманский","Oriental Gourmand"],"t":["qəhvə, zəfəran","кофе, шафран","coffee, saffron"],"h":["qızılgül, ud ağacı","роза, уд","rose, oud"],"b":["vanil, müşk","ваниль, мускус","vanilla, musk"],"s":["Payız–qış; axşam","Осень–зима; вечер","Autumn–winter; evening"],"d":["Kişi və qadınlar üçün şərq qurman ətir. Açılışda qəhvə və zəfəran, ürəyində qızılgül və ud ağacı, bazasında isə vanil və müşk hiss olunur. Payız, qış və axşam çıxışları üçün idealdır.","Восточный гурманский аромат для мужчин и женщин. Начало — кофе и шафран; в сердце — роза и уд; в базе — ваниль и мускус. Идеален для осени, зимы и вечерних выходов.","Oriental gourmand fragrance for men and women. It opens with coffee and saffron, reveals rose and oud in the heart and settles on vanilla and musk. Ideal for autumn, winter and evenings out."]},{"f":["Odunsu-ədviyyatlı","Древесный пряный","Woody Spicy"],"t":["limon, qara qarağat, berqamot","лимон, чёрная смородина, бергамот","lemon, blackcurrant, bergamot"],"h":["istiot, paçuli, jasmin","перец, пачули, жасмин","pepper, patchouli, jasmine"],"b":["dəri, səndəl ağacı, vanil, palıd mamırı","кожа, сандал, ваниль, дубовый мох","leather, sandalwood, vanilla, oakmoss"],"s":["Bütün fəsillər; gündüz və axşam","Всесезонный; день и вечер","All seasons; day & evening"],"d":["Kişilər üçün odunsu-ədviyyatlı ətir. Açılışda limon, qara qarağat və berqamot, ürəyində istiot və paçuli, bazasında isə dəri, səndəl ağacı və vanil hiss olunur. Universaldır: istənilən fəsildə, gündüz və axşam uyğundur.","Древесный пряный аромат для мужчин. Начало — лимон, чёрная смородина и бергамот; в сердце — перец и пачули; в базе — кожа, сандал и ваниль. Универсален: подходит для любого сезона, днём и вечером.","Woody spicy fragrance for men. It opens with lemon, blackcurrant and bergamot, reveals pepper and patchouli in the heart and settles on leather, sandalwood and vanilla. Versatile: suits any season, day or evening."]},{"f":["Şərq odunsu","Восточный древесный","Oriental Woody"],"t":["zəfəran, hil","шафран, кардамон","saffron, cardamom"],"h":["qızılgül, ud ağacı","роза, уд","rose, oud"],"b":["kəhrəba, müşk","амбра, мускус","amber, musk"],"s":["Payız–qış; axşam","Осень–зима; вечер","Autumn–winter; evening"],"d":["Kişi və qadınlar üçün şərq odunsu ətir. Açılışda zəfəran və hil, ürəyində qızılgül və ud ağacı, bazasında isə kəhrəba və müşk hiss olunur. Payız, qış və axşam çıxışları üçün idealdır.","Восточный древесный аромат для мужчин и женщин. Начало — шафран и кардамон; в сердце — роза и уд; в базе — амбра и мускус. Идеален для осени, зимы и вечерних выходов.","Oriental woody fragrance for men and women. It opens with saffron and cardamom, reveals rose and oud in the heart and settles on amber and musk. Ideal for autumn, winter and evenings out."]},{"f":["Şərq odunsu","Восточный древесный","Oriental Woody"],"t":["zəfəran, zəncəfil, berqamot","шафран, имбирь, бергамот","saffron, ginger, bergamot"],"h":["qızılgül, kəhrəba","роза, амбра","rose, amber"],"b":["vanil, səndəl ağacı, müşk","ваниль, сандал, мускус","vanilla, sandalwood, musk"],"s":["Payız–qış; axşam","Осень–зима; вечер","Autumn–winter; evening"],"d":["Kişi və qadınlar üçün şərq odunsu ətir. Açılışda zəfəran, zəncəfil və berqamot, ürəyində qızılgül və kəhrəba, bazasında isə vanil, səndəl ağacı və müşk hiss olunur. Payız, qış və axşam çıxışları üçün idealdır.","Восточный древесный аромат для мужчин и женщин. Начало — шафран, имбирь и бергамот; в сердце — роза и амбра; в базе — ваниль, сандал и мускус. Идеален для осени, зимы и вечерних выходов.","Oriental woody fragrance for men and women. It opens with saffron, ginger and bergamot, reveals rose and amber in the heart and settles on vanilla, sandalwood and musk. Ideal for autumn, winter and evenings out."]},{"f":["Şərq ədviyyatlı","Восточный пряный","Oriental Spicy"],"t":["darçın, muskat qozu, zəfəran","корица, мускатный орех, шафран","cinnamon, nutmeg, saffron"],"h":["tütün yarpağı, paçuli","табачный лист, пачули","tobacco leaf, patchouli"],"b":["vanil, kəhrəba, ud ağacı","ваниль, амбра, уд","vanilla, amber, oud"],"s":["Payız–qış; axşam","Осень–зима; вечер","Autumn–winter; evening"],"d":["Kişi və qadınlar üçün şərq ədviyyatlı ətir. Açılışda darçın, muskat qozu və zəfəran, ürəyində tütün yarpağı və paçuli, bazasında isə vanil, kəhrəba və ud ağacı hiss olunur. Payız, qış və axşam çıxışları üçün idealdır.","Восточный пряный аромат для мужчин и женщин. Начало — корица, мускатный орех и шафран; в сердце — табачный лист и пачули; в базе — ваниль, амбра и уд. Идеален для осени, зимы и вечерних выходов.","Oriental spicy fragrance for men and women. It opens with cinnamon, nutmeg and saffron, reveals tobacco leaf and patchouli in the heart and settles on vanilla, amber and oud. Ideal for autumn, winter and evenings out."]},{"f":["Şərq vanilli","Восточный ванильный","Oriental Vanilla"],"t":["limon","лимон","lemon"],"h":["qızılgül","роза","rose"],"b":["vanil, müşk","ваниль, мускус","vanilla, musk"],"s":["Payız–qış; gündüz və axşam","Осень–зима; день и вечер","Autumn–winter; day & evening"],"d":["Qadınlar üçün şərq vanilli ətir. Açılışda limon, ürəyində qızılgül, bazasında isə vanil və müşk hiss olunur. Xüsusilə sərin havalarda yaxşıdır.","Восточный ванильный аромат для женщин. Начало — лимон; в сердце — роза; в базе — ваниль и мускус. Особенно хорош в прохладное время года.","Oriental vanilla fragrance for women. It opens with lemon, reveals rose in the heart and settles on vanilla and musk. Especially good in the cooler months."]},{"f":["Şərq qurman","Восточный гурманский","Oriental Gourmand"],"t":["limon, kola","лимон, кола","lemon, cola"],"h":["tonka paxlası","бобы тонка","tonka bean"],"b":["vanil, kəhrəba","ваниль, амбра","vanilla, amber"],"s":["Payız–qış; gündüz və axşam","Осень–зима; день и вечер","Autumn–winter; day & evening"],"d":["Kişi və qadınlar üçün şərq qurman ətir. Açılışda limon və kola, ürəyində tonka paxlası, bazasında isə vanil və kəhrəba hiss olunur. Xüsusilə sərin havalarda yaxşıdır.","Восточный гурманский аромат для мужчин и женщин. Начало — лимон и кола; в сердце — бобы тонка; в базе — ваниль и амбра. Особенно хорош в прохладное время года.","Oriental gourmand fragrance for men and women. It opens with lemon and cola, reveals tonka bean in the heart and settles on vanilla and amber. Especially good in the cooler months."]},{"f":["Şərq odunsu","Восточный древесный","Oriental Woody"],"t":["gavalı, zəfəran, süsən","слива, шафран, ирис","plum, saffron, iris"],"h":["qızılgül, jasmin","роза, жасмин","rose, jasmine"],"b":["kəhrəba, vetiver, papirus","амбра, ветивер, папирус","amber, vetiver, papyrus"],"s":["Payız–qış; axşam","Осень–зима; вечер","Autumn–winter; evening"],"d":["Qadınlar üçün şərq odunsu ətir. Açılışda gavalı, zəfəran və süsən, ürəyində qızılgül və jasmin, bazasında isə kəhrəba, vetiver və papirus hiss olunur. Payız, qış və axşam çıxışları üçün idealdır.","Восточный древесный аромат для женщин. Начало — слива, шафран и ирис; в сердце — роза и жасмин; в базе — амбра, ветивер и папирус. Идеален для осени, зимы и вечерних выходов.","Oriental woody fragrance for women. It opens with plum, saffron and iris, reveals rose and jasmine in the heart and settles on amber, vetiver and papyrus. Ideal for autumn eveals cacao in the heart and settles on vanilla and woody notes. Ideal for autumn, winter and evenings out."]},{"f":["Çiçəkli-meyvəli","Цветочный фруктовый","Floral Fruity"],"t":["manqo, berqamot","манго, бергамот","mango, bergamot"],"h":["jasmin","жасмин","jasmine"],"b":["buxur, vanil","ладан, ваниль","incense, vanilla"],"s":["Payız–qış; gündüz və axşam","Осень–зима; день и вечер","Autumn–winter; day & evening"],"d":["Qadınlar üçün çiçəkli-meyvəli ətir. Açılışda manqo və berqamot, ürəyində jasmin, bazasında isə buxur və vanil hiss olunur. Xüsusilə sərin havalarda yaxşıdır.","Цветочный фруктовый аромат для женщин. Начало — манго и бергамот; в сердце — жасмин; в базе — ладан и ваниль. Особенно хорош в прохладное время года.","Floral fruity fragrance for women. It opens with mango and bergamot, reveals jasmine in the heart and settles on incense and vanilla. Especially good in the cooler months."]},{"f":["Odunsu-dəniz","Древесный водный","Woody Aquatic"],"t":["qreypfrut, dəniz notları, mandarin","грейпфрут, морские ноты, мандарин","grapefruit, sea notes, mandarin"],"h":["dəfnə yarpağı, jasmin","лавровый лист, жасмин","bay leaf, jasmine"],"b":["ənbər, qvayak ağacı, palıd mamırı, paçuli","серая амбра, гваяковое дерево, дубовый мох, пачули","ambergris, guaiac wood, oakmoss, patchouli"],"s":["Yaz–yay; gündüz","Весна–лето; день","Spring–summer; daytime"],"d":["İdmanlı və enerjili: odunsu-kəhrəba bazası üzərində qreypfrut və dəniz notları. Aktiv kişilər üçün təravətli ətir.","Спортивный и энергичный: грейпфрут и морские ноты на древесно-амбровой базе. Свежий аромат для активных мужчин.","Sporty and energetic: grapefruit and sea notes over a woody-amber base. A fresh scent for active men."]},{"f":["Aromatik dəniz","Ароматический водный","Aromatic Aquatic"],"t":["qreypfrut, dəniz notları","грейпфрут, морские ноты","grapefruit, sea notes"],"h":["istiot","перец","pepper"],"b":["ambroksan, qvayak ağacı","амброксан, гваяковое дерево","ambroxan, guaiac wood"],"s":["Yaz–yay; gündüz","Весна–лето; день","Spring–summer; daytime"],"d":["Kişilər üçün aromatik dəniz ətir. Açılışda qreypfrut və dəniz notları, ürəyində istiot, bazasında isə ambroksan və qvayak ağacı hiss olunur. Ən yaxşı yaz və yay aylarında, gündüz açılır.","Ароматический водный аромат для мужчин. Начало — грейпфрут и морские ноты; в сердце — перец; в базе — амброксан и гваяковое дерево. Лучше всего раскрывается весной и летом, в дневное время.","Aromatic aquatic fragrance for men. It opens with grapefruit and sea notes, reveals pepper in the heart and settles on ambroxan and guaiac wood. At its best in spring and summer, during the day."]},{"f":["Odunsu-ədviyyatlı","Древесный пряный","Woody Spicy"],"t":["berqamot","бергамот","bergamot"],"h":["sərv, ardıc","кипарис, можжевельник","cypress, juniper"],"b":["kəhrəba, vetiver","амбра, ветивер","amber, vetiver"],"s":["Bütün fəsillər; gündüz və axşam","Всесезонный; день и вечер","All seasons; day & evening"],"d":["Kişilər üçün odunsu-ədviyyatlı ətir. Açılışda berqamot, ürəyində sərv və ardıc, bazasında isə kəhrəba və vetiver hiss olunur. Universaldır: istənilən fəsildə, gündüz və axşam uyğundur.","Древесный пряный аромат для мужчин. Начало — бергамот; в сердце — кипарис и можжевельник; в базе — амбра и ветивер. Универсален: подходит для любого сезона, днём и вечером.","Woody spicy fragrance for men. It opens with bergamot, reveals cypress and juniper in the heart and settles on amber and vetiver. Versatile: suits any season, day or evening."]},{"f":["Odunsu-aromatik","Древесный ароматический","Woody Aromatic"],"t":["qreypfrut, istiot","грейпфрут, перец","grapefruit, pepper"],"h":["sərv, absent","кипарис, абсент","cypress, absinthe"],"b":["paçuli, vetiver","пачули, ветивер","patchouli, vetiver"],"s":["Bütün fəsillər; gündüz və axşam","Всесезонный; день и вечер","All seasons; day & evening"],"d":["Kişilər üçün odunsu-aromatik ətir. Açılışda qreypfrut və istiot, ürəyində sərv və absent, bazasında isə paçuli və vetiver hiss olunur. Universaldır: istənilən fəsildə, gündüz və axşam uyğundur.","Древесный ароматический аромат для мужчин. Начало — грейпфрут и перец; в сердце — кипарис и абсент; в базе — пачули и ветивер. Универсален: подходит для любого сезона, днём и вечером.","Woody aromatic fragrance for men. It opens with grapefruit and pepper, reveals cypress and absinthe in the heart and settles on patchouli and vetiver. Versatile: suits any season, day or evening."]},{"f":["Şərq ədviyyatlı","Восточный пряный","Oriental Spicy"],"t":["çəhrayı istiot, limon","розовый перец, лимон","pink pepper, lemon"],"h":["lavanda","лаванда","lavender"],"b":["vanil, tonka paxlası, kəhrəba","ваниль, бобы тонка, амбра","vanilla, tonka bean, amber"],"s":["Payız–qış; axşam","Осень–зима; вечер","Autumn–winter; evening"],"d":["Kişilər üçün şərq ədviyyatlı ətir. Açılışda çəhrayı istiot və limon, ürəyində lavanda, bazasında isə vanil, tonka paxlası və kəhrəba hiss olunur. Payız, qış və axşam çıxışları üçün idealdır.","Восточный пряный аромат для мужчин. Начало — розовый перец и лимон; в сердце — лаванда; в базе — ваниль, бобы тонка и амбра. Идеален для осени, зимы и вечерних выходов.","Oriental spicy fragrance for men. It opens with pink pepper and lemon, reveals lavender in the heart and settles on vanilla, tonka bean and amber. Ideal for autumn, winter and evenings out."]},{"f":["Çiçəkli-odunsu","Цветочный древесный","Floral Woody"],"t":["moruq, neroli, limon","малина, нероли, лимон","raspberry, neroli, lemon"],"h":["jasmin, portağal çiçəyi, qardeniya","жасмин, цветок апельсина, гардения","jasmine, orange blossom, gardenia"],"b":["bal, paçuli, kəhrəba","мёд, пачули, амбра","honey, patchouli, amber"],"s":["Payız–qış; gündüz və axşam","Осень–зима; день и вечер","Autumn–winter; day & evening"],"d":["Parlaq ağ çiçəklər və ballı paçuli bazası ilə moruq və neroli. Qlamurlu və işıltılı ətir.","Малина и нероли с искрящимися белыми цветами и медово-пачулиевой базой. Гламурный и сияющий аромат.","Raspberry and neroli with sparkling white flowers and a honeyed patchouli base. Glamorous and radiant."]},{"f":["Şərq çiçəkli","Восточный цветочный","Oriental Floral"],"t":["moruq","малина","raspberry"],"h":["portağal çiçəyi","цветок апельсина","orange blossom"],"b":["paçuli, vanil","пачули, ваниль","patchouli, vanilla"],"s":["Payız–qış; axşam","Осень–зима; вечер","Autumn–winter; evening"],"d":["Qadınlar üçün şərq çiçəkli ətir. Açılışda moruq, ürəyində portağal çiçəyi, bazasında isə paçuli və vanil hiss olunur. Payız, qış və axşam çıxışları üçün idealdır.","Восточный цветочный аромат для женщин. Начало — малина; в сердце — цветок апельсина; в базе — пачули и ваниль. Идеален для осени, зимы и вечерних выходов.","Oriental floral fragrance for women. It opens with raspberry, reveals orange blossom in the heart and settles on patchouli and vanilla. Ideal for autumn, winter and evenings out."]},{"f":["Şərq vanilli","Восточный ванильный","Oriental Vanilla"],"t":["yaşıl mandarin, su jasmini","зелёный мандарин, водяной жасмин","green mandarin, water jasmine"],"h":["duz, vanil","соль, ваниль","salt, vanilla"],"b":["səndəl ağacı, kaşmir ağacı","сандал, кашемировое дерево","sandalwood, cashmere wood"],"s":["Payız–qış; gündüz və axşam","Осень–зима; день и вечер","Autumn–winter; day & evening"],"d":["Qadınlar üçün şərq vanilli ətir. Açılışda yaşıl mandarin və su jasmini, ürəyində duz və vanil, bazasında isə səndəl ağacı və kaşmir ağacı hiss olunur. Xüsusilə sərin havalarda yaxşıdır.","Восточный ванильный аромат для женщин. Начало — зелёный мандарин и водяной жасмин; в сердце — соль и ваниль; в базе — сандал и кашемировое дерево. Особенно хорош в прохладное время года.","Oriental vanilla fragrance for women. It opens with green mandarin and water jasmine, reveals salt and vanilla in the heart and settles on sandalwood and cashmere wood. Especially good in the cooler months."]},{"f":["Şərq çiçəkli","Восточный цветочный","Oriental Floral"],"t":["istiot, badam","перец, миндаль","pepper, almond"],"h":["vanil","ваниль","vanilla"],"b":["kəhrəba, müşk","амбра, мускус","amber, musk"],"s":["Payız–qış; axşam","Осень–зима; вечер","Autumn–winter; evening"],"d":["Qadınlar üçün şərq çiçəkli ətir. Açılışda istiot və badam, ürəyində vanil, bazasında isə kəhrəba və müşk hiss olunur. Payız, qış və axşam çıxışları üçün idealdır.","Восточный цветочный аромат для женщин. Начало — перец и миндаль; в сердце — ваниль; в базе — амбра и мускус. Идеален для осени, зимы и вечерних выходов.","Oriental floral fragrance for women. It opens with pepper and almond, reveals vanilla in the heart and settles on amber and musk. Ideal for autumn, winter and evenings out."]},{"f":["Şərq vanilli","Восточный ванильный","Oriental Vanilla"],"t":["portağal çiçəyi, hil, darçın","цветок апельсина, кардамон, корица","orange blossom, cardamom, cinnamon"],"h":["pralin, vanil","пралине, ваниль","praline, vanilla"],"b":["qvayak ağacı, müşk","гваяковое дерево, мускус","guaiac wood, musk"],"s":["Payız–qış; axşam","Осень–зима; вечер","Autumn–winter; evening"],"d":["Kişilər üçün şərq vanilli ətir. Açılışda portağal çiçəyi, hil və darçın, ürəyində pralin və vanil, bazasında isə qvayak ağacı və müşk hiss olunur. Payız, qış və axşam çıxışları üçün idealdır.","Восточный ванильный аромат для мужчин. Начало — цветок апельсина, кардамон и корица; в сердце — пралине и ваниль; в базе — гваяковое дерево и мускус. Идеален для осени, зимы и вечерних выходов.","Oriental vanilla fragrance for men. It opens with orange blossom, cardamom and cinnamon, reveals praline and vanilla in the heart and settles on guaiac wood and musk. Ideal for autumn, winter and evenings out."]},{"f":["Çiçəkli-meyvəli","Цветочный фруктовый","Floral Fruity"],"t":["liçi, rəvənd, berqamot, muskat qozu","личи, ревень, бергамот, мускатный орех","lychee, rhubarb, bergamot, nutmeg"],"h":["qızılgül, pion, vanil","роза, пион, ваниль","rose, peony, vanilla"],"b":["kaşmeran, buxur, sidr, vetiver","кашмеран, ладан, кедр, ветивер","cashmeran, incense, cedar, vetiver"],"s":["Yaz–payız; gündüz","Весна–осень; день","Spring–autumn; daytime"],"d":["Şirəli liçi və rəvəndlə türk qızılgülü və piondan romantik buket. İncə, parlaq və çox qadınsı.","Романтичный букет турецкой розы и пиона с сочными личи и ревенём. Нежный, яркий и очень женственный.","A romantic bouquet of Turkish rose and peony with juicy lychee and rhubarb. Tender, bright and very feminine."]},{"f":["Çiçəkli","Цветочный","Floral"],"t":["liçi, armud, berqamot","личи, груша, бергамот","lychee, pear, bergamot"],"h":["qızılgül","роза","rose"],"b":["vetiver, kəhrəba, buxur","ветивер, амбра, ладан","vetiver, amber, incense"],"s":["Yaz–payız; gündüz","Весна–осень; день","Spring–autumn; daytime"],"d":["Kişi və qadınlar üçün çiçəkli ətir. Açılışda liçi, armud və berqamot, ürəyində qızılgül, bazasında isə vetiver, kəhrəba və buxur hiss olunur. Yaz və payız üçün, xüsusən gündüz uyğundur.","Цветочный аромат для мужчин и женщин. Начало — личи, груша и бергамот; в сердце — роза; в базе — ветивер, амбра и ладан. Подходит для весны и осени, особенно днём.","Floral fragrance for men and women. It opens with lychee, pear and bergamot, reveals rose in the heart and settles on vetiver, amber and incense. Suits spring and autumn, especially in the daytime."]},{"f":["Sitrus-aromatik","Цитрусовый ароматический","Citrus Aromatic"],"t":["berqamot, limon","бергамот, лимон","bergamot, lemon"],"h":["portağal çiçəyi, inciçiçəyi","цветок апельсина, ландыш","orange blossom, lily of the valley"],"b":["müşk, kəhrəba","мускус, амбра","musk, amber"],"s":["Yaz–yay; gündüz","Весна–лето; день","Spring–summer; daytime"],"d":["Kişi və qadınlar üçün sitrus-aromatik ətir. Açılışda berqamot və limon, ürəyində portağal çiçəyi və inciçiçəyi, bazasında isə müşk və kəhrəba hiss olunur. Ən yaxşı yaz və yay aylarında, gündüz açılır.","Цитрусовый ароматический аромат для мужчин и женщин. Начало — бергамот и лимон; в сердце — цветок апельсина и ландыш; в базе — мускус и амбра. Лучше всего раскрывается весной и летом, в дневное время.","Citrus aromatic fragrance for men and women. It opens with bergamot and lemon, reveals orange blossom and lily of the valley in the heart and settles on musk and amber. At its best in spring and summer, during the day."]},{"f":["Şərq ədviyyatlı","Восточный пряный","Oriental Spicy"],"t":["darçın, istiot","корица, перец","cinnamon, pepper"],"h":["tütün yarpağı, buxur","табачный лист, ладан","tobacco leaf, incense"],"b":["vanil, sidr, müşk","ваниль, кедр, мускус","vanilla, cedar, musk"],"s":["Payız–qış; axşam","Осень–зима; вечер","Autumn–winter; evening"],"d":["Kişilər üçün şərq ədviyyatlı ətir. Açılışda darçın və istiot, ürəyində tütün yarpağı və buxur, bazasında isə vanil, sidr və müşk hiss olunur. Payız, qış və axşam çıxışları üçün idealdır.","Восточный пряный аромат для мужчин. Начало — корица и перец; в сердце — табачный лист и ладан; в базе — ваниль, кедр и мускус. Идеален для осени, зимы и вечерних выходов.","Oriental spicy fragrance for men. It opens with cinnamon and pepper, reveals tobacco leaf and incense in the heart and settles on vanilla, cedar and musk. Ideal for autumn, winter and evenings out."]},{"f":["Kəhrəba-ədviyyatlı","Амбровый пряный","Amber Spicy"],"t":["alma, lavanda, berqamot, mandarin","яблоко, лаванда, бергамот, мандарин","apple, lavender, bergamot, mandarin"],"h":["ətirşah, bənövşə, jasmin","герань, фиалка, жасмин","geranium, violet, jasmine"],"b":["vanil, hil, səndəl ağacı, istiot, paçuli, qvayak ağacı","ваниль, кардамон, сандал, перец, пачули, гваяковое дерево","vanilla, cardamom, sandalwood, pepper, patchouli, guaiac wood"],"s":["Payız–qış; gündüz və axşam","Осень–зима; день и вечер","Autumn–winter; day & evening"],"d":["Vanil, hil və odunsu notlardan isti baza üzərində təzə alma və lavanda. Hamının xoşuna gələn, gözəl iz buraxan zərif ətir.","Свежее яблоко и лаванда на тёплой базе из ванили, кардамона и древесины. Элегантный аромат, который нравится всем, с отличным шлейфом.","Fresh apple and lavender over a warm base of vanilla, cardamom and woods. An elegant, crowd-pleasing scent with excellent projection."]},{"f":["Çiçəkli","Цветочный","Floral"],"t":["qara qarağat, liçi","чёрная смородина, личи","blackcurrant, lychee"],"h":["qızılgül, bənövşə","роза, фиалка","rose, violet"],"b":["müşk, vanil","мускус, ваниль","musk, vanilla"],"s":["Yaz–payız; gündüz","Весна–осень; день","Spring–autumn; daytime"],"d":["Qadınlar üçün çiçəkli ətir. Açılışda qara qarağat və liçi, ürəyində qızılgül və bənövşə, bazasında isə müşk və vanil hiss olunur. Yaz və payız üçün, xüsusən gündüz uyğundur.","Цветочный аромат для женщин. Начало — чёрная смородина и личи; в сердце — роза и фиалка; в базе — мускус и ваниль. Подходит для весны и осени, особенно днём.","Floral fragrance for women. It opens with blackcurrant and lychee, reveals rose and violet in the heart and settles on musk and vanilla. Suits spring and autumn, especially in the daytime."]},{"f":["Şərq qurman","Восточный гурманский","Oriental Gourmand"],"t":["darçın, bal","корица, мёд","cinnamon, honey"],"h":["tonka paxlası, vanil","бобы тонка, ваниль","tonka bean, vanilla"],"b":["kəhrəba, odunsu notlar","амбра, древесные ноты","amber, woody notes"],"s":["Payız–qış; axşam","Осень–зима; вечер","Autumn–winter; evening"],"d":["Kişilər üçün şərq qurman ətir. Açılışda darçın və bal, ürəyində tonka paxlası və vanil, bazasında isə kəhrəba və odunsu notlar hiss olunur. Payız, qış və axşam çıxışları üçün idealdır.","Восточный гурманский аромат для мужчин. Начало — корица и мёд; в сердце — бобы тонка и ваниль; в базе — амбра и древесные ноты. Идеален для осени, зимы и вечерних выходов.","Oriental gourmand fragrance for men. It opens with cinnamon and honey, reveals tonka bean and vanilla in the heart and settles on amber and woody notes. Ideal for autumn, winter and evenings out."]},{"f":["Şərq","Восточный","Oriental"],"t":["berqamot, heliotrop","бергамот, гелиотроп","bergamot, heliotrope"],"h":["badam, lavanda, jasmin","миндаль, лаванда, жасмин","almond, lavender, jasmine"],"b":["vanil, səndəl ağacı, kəhrəba","ваниль, сандал, амбра","vanilla, sandalwood, amber"],"s":["Payız–qış; gündüz və axşam","Осень–зима; день и вечер","Autumn–winter; day & evening"],"d":["Kişilər üçün şərq ətir. Açılışda berqamot və heliotrop, ürəyində badam və lavanda, bazasında isə vanil, səndəl ağacı və kəhrəba hiss olunur. Xüsusilə sərin havalarda yaxşıdır.","Восточный аромат для мужчин. Начало — бергамот и гелиотроп; в сердце — миндаль и лаванда; в базе — ваниль, сандал и амбра. Особенно хорош в прохладное время года.","Oriental fragrance for men. It opens with bergamot and heliotrope, reveals almond and lavender in the heart and settles on vanilla, sandalwood and amber. Especially good in the cooler months."]},{"f":["Aromatik fujer","Ароматический фужерный","Aromatic Fougère"],"t":["mandarin, berqamot","мандарин, бергамот","mandarin, bergamot"],"h":["lavanda, darçın","лаванда, корица","lavender, cinnamon"],"b":["müşk, kəhrəba","мускус, амбра","musk, amber"],"s":["Bütün fəsillər; gündüz və axşam","Всесезонный; день и вечер","All seasons; day & evening"],"d":["Kişi və qadınlar üçün aromatik fujer ətir. Açılışda mandarin və berqamot, ürəyində lavanda və darçın, bazasında isə müşk və kəhrəba hiss olunur. Universaldır: istənilən fəsildə, gündüz və axşam uyğundur.","Ароматический фужерный аромат для мужчин и женщин. Начало — мандарин и бергамот; в сердце — лаванда и корица; в базе — мускус и амбра. Универсален: подходит для любого сезона, днём и вечером.","Aromatic fougère fragrance for men and women. It opens with mandarin and bergamot, reveals lavender and cinnamon in the heart and settles on musk and amber. Versatile: suits any season, day or evening."]},{"f":["Çiçəkli-müşk","Цветочный мускусный","Floral Musk"],"t":["berqamot, mandarin","бергамот, мандарин","bergamot, mandarin"],"h":["portağal çiçəyi, şaftalı","цветок апельсина, персик","orange blossom, peach"],"b":["ağ müşk, vanil","белый мускус, ваниль","white musk, vanilla"],"s":["Bütün fəsillər; gündüz və a  и вечер","Autumn–winter; day & evening"],"d":["Kişilər üçün odunsu-aromatik ətir. Açılışda brendi, ürəyində tonka paxlası və təraş sabunu, bazasında isə kəhrəba və odunsu notlar hiss olunur. Xüsusilə sərin havalarda yaxşıdır.","Древесный ароматический аромат для мужчин. Начало — бренди; в сердце — бобы тонка и мыло для бритья; в базе — амбра и древесные ноты. Особенно хорош в прохладное время года.","Woody aromatic fragrance for men. It opens with brandy, reveals tonka bean and shaving soap in the heart and settles on amber and woody notes. Especially good in the cooler months."]},{"f":["Şərq qurman","Восточный гурманский","Oriental Gourmand"],"t":["karamel","карамель","caramel"],"h":["müşk, pudralı notlar","мускус, пудровые ноты","musk, powdery notes"],"b":["benzoin, vanil","бензоин, ваниль","benzoin, vanilla"],"s":["Payız–qış; axşam","Осень–зима; вечер","Autumn–winter; evening"],"d":["Qadınlar üçün şərq qurman ətir. Açılışda karamel, ürəyində müşk və pudralı notlar, bazasında isə benzoin və vanil hiss olunur. Payız, qış və axşam çıxışları üçün idealdır.","Восточный гурманский аромат для женщин. Начало — карамель; в сердце — мускус и пудровые ноты; в базе — бензоин и ваниль. Идеален для осени, зимы и вечерних выходов.","Oriental gourmand fragrance for women. It opens with caramel, reveals musk and powdery notes in the heart and settles on benzoin and vanilla. Ideal for autumn, winter and evenings out."]},{"f":["Odunsu-çiçəkli-müşk","Древесный цветочный мускусный","Woody Floral Musk"],"t":["neroli, istiot","нероли, перец","neroli, pepper"],"h":["süsən, bənövşə","ирис, фиалка","iris, violet"],"b":["kəhrəba, paçuli, sidr","амбра, пачули, кедр","amber, patchouli, cedar"],"s":["Bütün fəsillər; gündüz və axşam","Всесезонный; день и вечер","All seasons; day & evening"],"d":["Kişilər üçün odunsu-çiçəkli-müşk ətir. Açılışda neroli və istiot, ürəyində süsən və bənövşə, bazasında isə kəhrəba, paçuli və sidr hiss olunur. Universaldır: istənilən fəsildə, gündüz və axşam uyğundur.","Древесный цветочный мускусный аромат для мужчин. Начало — нероли и перец; в сердце — ирис и фиалка; в базе — амбра, пачули и кедр. Универсален: подходит для любого сезона, днём и вечером.","Woody floral musk fragrance for men. It opens with neroli and pepper, reveals iris and violet in the heart and settles on amber, patchouli and cedar. Versatile: suits any season, day or evening."]},{"f":["Aromatik fujer","Ароматический фужерный","Aromatic Fougère"],"t":["berqamot, istiot","бергамот, перец","bergamot, pepper"],"h":["lavanda","лаванда","lavender"],"b":["ambroksan, paçuli","амброксан, пачули","ambroxan, patchouli"],"s":["Bütün fəsillər; gündüz və axşam","Всесезонный; день и вечер","All seasons; day & evening"],"d":["Kişilər üçün aromatik fujer ətir. Açılışda berqamot və istiot, ürəyində lavanda, bazasında isə ambroksan və paçuli hiss olunur. Universaldır: istənilən fəsildə, gündüz və axşam uyğundur.","Ароматический фужерный аромат для мужчин. Начало — бергамот и перец; в сердце — лаванда; в базе — амброксан и пачули. Универсален: подходит для любого сезона, днём и вечером.","Aromatic fougère fragrance for men. It opens with bergamot and pepper, reveals lavender in the heart and settles on ambroxan and patchouli. Versatile: suits any season, day or evening."]},{"f":["Çiçəkli-müşk","Цветочный мускусный","Floral Musk"],"t":["armud, mandarin","груша, мандарин","pear, mandarin"],"h":["neroli, jasmin","нероли, жасмин","neroli, jasmine"],"b":["kəhrəba, vanil, müşk","амбра, ваниль, мускус","amber, vanilla, musk"],"s":["Bütün fəsillər; gündüz və axşam","Всесезонный; день и вечер","All seasons; day & evening"],"d":["Qadınlar üçün çiçəkli-müşk ətir. Açılışda armud və mandarin, ürəyində neroli və jasmin, bazasında isə kəhrəba, vanil və müşk hiss olunur. Universaldır: istənilən fəsildə, gündüz və axşam uyğundur.","Цветочный мускусный аромат для женщин. Начало — груша и мандарин; в сердце — нероли и жасмин; в базе — амбра, ваниль и мускус. Универсален: подходит для любого сезона, днём и вечером.","Floral musk fragrance for women. It opens with pear and mandarin, reveals neroli and jasmine in the heart and settles on amber, vanilla and musk. Versatile: suits any season, day or evening."]},{"f":["Aromatik dəniz","Ароматический водный","Aromatic Aquatic"],"t":["xiyar, yemiş, mandarin","огурец, дыня, мандарин","cucumber, melon, mandarin"],"h":["reyhan, adaçayı","базилик, шалфей","basil, sage"],"b":["zamşa, müşk","замша, мускус","suede, musk"],"s":["Yaz–yay; gündüz","Весна–лето; день","Spring–summer; daytime"],"d":["Kişilər üçün aromatik dəniz ətir. Açılışda xiyar, yemiş və mandarin, ürəyində reyhan və adaçayı, bazasında isə zamşa və müşk hiss olunur. Ən yaxşı yaz və yay aylarında, gündüz açılır.","Ароматический водный аромат для мужчин. Начало — огурец, дыня и мандарин; в сердце — базилик и шалфей; в базе — замша и мускус. Лучше всего раскрывается весной и летом, в дневное время.","Aromatic aquatic fragrance for men. It opens with cucumber, melon and mandarin, reveals basil and sage in the heart and settles on suede and musk. At its best in spring and summer, during the day."]},{"f":["Çiçəkli","Цветочный","Floral"],"t":["zəncəfil, qızılgül","имбирь, роза","ginger, rose"],"h":["zanbaq, bənövşə","лилия, фиалка","lily, violet"],"b":["müşk, palıd mamırı","мускус, дубовый мох","musk, oakmoss"],"s":["Yaz–payız; gündüz","Весна–осень; день","Spring–autumn; daytime"],"d":["Qadınlar üçün çiçəkli ətir. Açılışda zəncəfil və qızılgül, ürəyində zanbaq və bənövşə, bazasında isə müşk və palıd mamırı hiss olunur. Yaz və payız üçün, xüsusən gündüz uyğundur.","Цветочный аромат для женщин. Начало — имбирь и роза; в сердце — лилия и фиалка; в базе — мускус и дубовый мох. Подходит для весны и осени, особенно днём.","Floral fragrance for women. It opens with ginger and rose, reveals lily and violet in the heart and settles on musk and oakmoss. Suits spring and autumn, especially in the daytime."]},{"f":["Şərq çiçəkli","Восточный цветочный","Oriental Floral"],"t utumn, winter and evenings out."]},{"f":["Çiçəkli","Цветочный","Floral"],"t":["berqamot, portağal","бергамот, апельсин","bergamot, orange"],"h":["jasmin, lotus","жасмин, лотос","jasmine, lotus"],"b":["müşk, səndəl ağacı","мускус, сандал","musk, sandalwood"],"s":["Bütün fəsillər; gündüz və axşam","Всесезонный; день и вечер","All seasons; day & evening"],"d":["Qadınlar üçün çiçəkli ətir. Açılışda berqamot və portağal, ürəyində jasmin və lotus, bazasında isə müşk və səndəl ağacı hiss olunur. Universaldır: istənilən fəsildə, gündüz və axşam uyğundur.","Цветочный аромат для женщин. Начало — бергамот и апельсин; в сердце — жасмин и лотос; в базе — мускус и сандал. Универсален: подходит для любого сезона, днём и вечером.","Floral fragrance for women. It opens with bergamot and orange, reveals jasmine and lotus in the heart and settles on musk and sandalwood. Versatile: suits any season, day or evening."]},{"f":["Sitrus-meyvəli","Цитрусовый фруктовый","Citrus Fruity"],"t":["portağal, limon, berqamot","апельсин, лимон, бергамот","orange, lemon, bergamot"],"h":["meyvəli notlar","фруктовые ноты","fruity notes"],"b":["ağ müşk, vanil, kəhrəba","белый мускус, ваниль, амбра","white musk, vanilla, amber"],"s":["Bütün fəsillər; gündüz və axşam","Всесезонный; день и вечер","All seasons; day & evening"],"d":["Yumşaq müşk-vanil bazası üzərində sitrus və meyvələrin parlaq, şirəli partlayışı. Şən, diqqət çəkən və çox davamlı.","Яркий сочный взрыв цитрусов и фруктов на мягкой мускусно-ванильной базе. Жизнерадостный, заметный и очень стойкий.","A bright, juicy explosion of citrus and fruits on a soft musk-vanilla base. Cheerful, noticeable and very long-lasting."]},{"f":["Şərq odunsu","Восточный древесный","Oriental Woody"],"t":["jasmin","жасмин","jasmine"],"h":["kaşmir ağacı","кашемировое дерево","cashmere wood"],"b":["kəhrəba","амбра","amber"],"s":["Payız–qış; axşam","Осень–зима; вечер","Autumn–winter; evening"],"d":["Qadınlar üçün şərq odunsu ətir. Açılışda jasmin, ürəyində kaşmir ağacı, bazasında isə kəhrəba hiss olunur. Payız, qış və axşam çıxışları üçün idealdır.","Восточный древесный аромат для женщин. Начало — жасмин; в сердце — кашемировое дерево; в базе — амбра. Идеален для осени, зимы и вечерних выходов.","Oriental woody fragrance for women. It opens with jasmine, reveals cashmere wood in the heart and settles on amber. Ideal for autumn, winter and evenings out."]},{"f":["Şərq qurman","Восточный гурманский","Oriental Gourmand"],"t":["albalı","вишня","cherry"],"h":["pralin","пралине","praline"],"b":["paçuli, vanil","пачули, ваниль","patchouli, vanilla"],"s":["Payız–qış; axşam","Осень–зима; вечер","Autumn–winter; evening"],"d":["Qadınlar üçün şərq qurman ətir. Açılışda albalı, ürəyində pralin, bazasında isə paçuli və vanil hiss olunur. Payız, qış və axşam çıxışları üçün idealdır.","Восточный гурманский аромат для женщин. Начало — вишня; в сердце — пралине; в базе — пачули и ваниль. Идеален для осени, зимы и вечерних выходов.","Oriental gourmand fragrance for women. It opens with cherry, reveals praline in the heart and settles on patchouli and vanilla. Ideal for autumn, winter and evenings out."]},{"f":["Çiçəkli","Цветочный","Floral"],"t":["rəvənd","ревень","rhubarb"],"h":["portağal çiçəyi, pələng lianası","цветок апельсина, тигровая лиана","orange blossom, tiger liana"],"b":["vanil, odunsu notlar","ваниль, древесные ноты","vanilla, woody notes"],"s":["Yaz–payız; gündüz","Весна–осень; день","Spring–autumn; daytime"],"d":["Qadınlar üçün çiçəkli ətir. Açılışda rəvənd, ürəyində portağal çiçəyi və pələng lianası, bazasında isə vanil və odunsu notlar hiss olunur. Yaz və payız üçün, xüsusən gündüz uyğundur.","Цветочный аромат для женщин. Начало — ревень; в сердце — цветок апельсина и тигровая лиана; в базе — ваниль и древесные ноты. Подходит для весны и осени, особенно днём.","Floral fragrance for women. It opens with rhubarb, reveals orange blossom and tiger liana in the heart and settles on vanilla and woody notes. Suits spring and autumn, espec mmer; daytime"],"d":["Kişi və qadınlar üçün sitrus-aromatik ətir. Açılışda laym və hil, ürəyində tütün yarpağı, bazasında isə sidr və müşk hiss olunur. Ən yaxşı yaz və yay aylarında, gündüz açılır.","Цитрусовый ароматический аромат для мужчин и женщин. Начало — лайм и кардамон; в сердце — табачный лист; в базе — кедр и мускус. Лучше всего раскрывается весной и летом, в дневное время.","Citrus aromatic fragrance for men and women. It opens with lime and cardamom, reveals tobacco leaf in the heart and settles on cedar and musk. At its best in spring and summer, during the day."]},{"f":["Şərq qurman","Восточный гурманский","Oriental Gourmand"],"t":["şaftalı, qırmızı portağal","персик, красный апельсин","peach, blood orange"],"h":["rom, konyak","ром, коньяк","rum, cognac"],"b":["paçuli, vanil, səndəl ağacı","пачули, ваниль, сандал","patchouli, vanilla, sandalwood"],"s":["Payız–qış; axşam","Осень–зима; вечер","Autumn–winter; evening"],"d":["Kişi və qadınlar üçün şərq qurman ətir. Açılışda şaftalı və qırmızı portağal, ürəyində rom və konyak, bazasında isə paçuli, vanil və səndəl ağacı hiss olunur. Payız, qış və axşam çıxışları üçün idealdır.","Восточный гурманский аромат для мужчин и женщин. Начало — персик и красный апельсин; в сердце — ром и коньяк; в базе — пачули, ваниль и сандал. Идеален для осени, зимы и вечерних выходов.","Oriental gourmand fragrance for men and women. It opens with peach and blood orange, reveals rum and cognac in the heart and settles on patchouli, vanilla and sandalwood. Ideal for autumn, winter and evenings out."]},{"f":["Şərq çiçəkli","Восточный цветочный","Oriental Floral"],"t":["trüfel, ilanq-ilanq, berqamot, qara qarağat","трюфель, иланг-иланг, бергамот, чёрная смородина","truffle, ylang-ylang, bergamot, blackcurrant"],"h":["orxideya, ədviyyatlar, meyvəli notlar","орхидея, специи, фруктовые ноты","orchid, spices, fruity notes"],"b":["paçuli, buxur, vanil, tünd şokolad, səndəl ağacı","пачули, ладан, ваниль, тёмный шоколад, сандал","patchouli, incense, vanilla, dark chocolate, sandalwood"],"s":["Payız–qış; axşam","Осень–зима; вечер","Autumn–winter; evening"],"d":["Tünd, dəbdəbəli və sirli: trüfel, şokolad və buxurla qara orxideya. Seçilməyi sevənlər üçün zəngin axşam ətri.","Тёмный, роскошный и загадочный: чёрная орхидея с трюфелем, шоколадом и ладаном. Насыщенный вечерний аромат для тех, кто любит выделяться.","Dark, luxurious and mysterious: black orchid with truffle, chocolate and incense. A rich evening scent for those who love to stand out."]},{"f":["Çiçəkli-odunsu","Цветочный древесный","Floral Woody"],"t":["bənövşə, limon","фиалка, лимон","violet, lemon"],"h":["jasmin","жасмин","jasmine"],"b":["odunsu notlar, müşk","древесные ноты, мускус","woody notes, musk"],"s":["Bütün fəsillər; gündüz və axşam","Всесезонный; день и вечер","All seasons; day & evening"],"d":["Kişi və qadınlar üçün çiçəkli-odunsu ətir. Açılışda bənövşə və limon, ürəyində jasmin, bazasında isə odunsu notlar və müşk hiss olunur. Universaldır: istənilən fəsildə, gündüz və axşam uyğundur.","Цветочный древесный аромат для мужчин и женщин. Начало — фиалка и лимон; в сердце — жасмин; в базе — древесные ноты и мускус. Универсален: подходит для любого сезона, днём и вечером.","Floral woody fragrance for men and women. It opens with violet and lemon, reveals jasmine in the heart and settles on woody notes and musk. Versatile: suits any season, day or evening."]},{"f":["Şərq çiçəkli","Восточный цветочный","Oriental Floral"],"t":["zəfəran","шафран","saffron"],"h":["qızılgül, qəhvə","роза, кофе","rose, coffee"],"b":["buxur, paçuli","ладан, пачули","incense, patchouli"],"s":["Payız–qış; axşam","Осень–зима; вечер","Autumn–winter; evening"],"d":["Kişi və qadınlar üçün şərq çiçəkli ətir. Açılışda zəfəran, ürəyində qızılgül və qəhvə, bazasında isə buxur və paçuli hiss olunur. Payız, qış və axşam çıxışları üçün idealdır.","Восточный цветочный аромат для мужчин и женщин. Начало — шафран; в сердце — роза и кофе; в базе — ладан и пачули. Идеален для осени, зимы и вечерних выходов.","Oriental floral fragrance for men and women. It opens with saffron, reveals rose and coffee in the heart and settles on incense and patchouli. Ideal for autumn, winter and evenings out."]},{"f":["Şərq odunsu","Восточный древесный","Oriental Woody"],"t":["albalı, zəfəran","вишня, шафран","cherry, saffron"],"h":["osmantus, gavalı","османтус, слива","osmanthus, plum"],"b":["dəri, tüstü","кожа, дым","leather, smoke"],"s":["Payız–qış; axşam","Осень–зима; вечер","Autumn–winter; evening"],"d":["Kişi və qadınlar üçün şərq odunsu ətir. Açılışda albalı və zəfəran, ürəyində osmantus və gavalı, bazasında isə dəri və tüstü hiss olunur. Payız, qış və axşam çıxışları üçün idealdır.","Восточный древесный аромат для мужчин и женщин. Начало — вишня и шафран; в сердце — османтус и слива; в базе — кожа и дым. Идеален для осени, зимы и вечерних выходов.","Oriental woody fragrance for men and women. It opens with cherry and saffron, reveals osmanthus and plum in the heart and settles on leather and smoke. Ideal for autumn, winter and evenings out."]},{"f":["Odunsu-dəniz","Древесный водный","Woody Aquatic"],"t":["limon, dəniz yosunu","лимон, морские водоросли","lemon, seaweed"],"h":["sərv, mərsin","кипарис, мирт","cypress, myrtle"],"b":["vanil, kəhrəba","ваниль, амбра","vanilla, amber"],"s":["Yaz–yay; gündüz","Весна–лето; день","Spring–summer; daytime"],"d":["Kişi və qadınlar üçün odunsu-dəniz ətir. Açılışda limon və dəniz yosunu, ürəyində sərv və mərsin, bazasında isə vanil və kəhrəba hiss olunur. Ən yaxşı yaz və yay aylarında, gündüz açılır.","Древесный водный аромат для мужчин и женщин. Начало — лимон и морские водоросли; в сердце — кипарис и мирт; в базе — ваниль и амбра. Лучше всего раскрывается весной и летом, в дневное время.","Woody aquatic fragrance for men and women. It opens with lemon and seaweed, reveals cypress and myrtle in the heart and settles on vanilla and amber. At its best in spring and summer, during the day."]},{"f":["Çiçəkli-meyvəli","Цветочный фруктовый","Floral Fruity"],"t":["albalı, çəhrayı istiot","вишня, розовый перец","cherry, pink pepper"],"h":["jasmin","жасмин","jasmine"],"b":["müşk","мускус","musk"],"s":["Yaz–payız; gündüz","Весна–осень; день","Spring–autumn; daytime"],"d":["Kişi və qadınlar üçün çiçəkli-meyvəli ətir. Açılışda albalı və çəhrayı istiot, ürəyində jasmin, bazasında isə müşk hiss olunur. Yaz və payız üçün, xüsusən gündüz uyğundur.","Цветочный фруктовый аромат для мужчин и женщин. Начало — вишня и розовый перец; в сердце — жасмин; в базе — мускус. Подходит для весны и осени, особенно днём.","Floral fruity fragrance for men and women. It opens with cherry and pink pepper, reveals jasmine in the heart and settles on musk. Suits spring and autumn, especially in the daytime."]},{"f":["Dəri","Кожаный","Leather"],"t":["muskat adaçayı, lavanda","мускатный шалфей, лаванда","clary sage, lavender"],"h":["badam, süsən kökü","миндаль, корень ириса","almond, orris"],"b":["dəri, tonka paxlası, vanil","кожа, бобы тонка, ваниль","leather, tonka bean, vanilla"],"s":["Payız–qış; axşam","Осень–зима; вечер","Autumn–winter; evening"],"d":["Kişi və qadınlar üçün dəri ətir. Açılışda muskat adaçayı və lavanda, ürəyində badam və süsən kökü, bazasında isə dəri, tonka paxlası və vanil hiss olunur. Payız, qış və axşam çıxışları üçün idealdır.","Кожаный аромат для мужчин и женщин. Начало — мускатный шалфей и лаванда; в сердце — миндаль и корень ириса; в базе — кожа, бобы тонка и ваниль. Идеален для осени, зимы и вечерних выходов.","Leather fragrance for men and women. It opens with clary sage and lavender, reveals almond and orris in the heart and settles on leather, tonka bean and vanilla. Ideal for autumn, winter and evenings out."]},{"f":["Odunsu","Древесный","Woody"],"t":["qreypfrut, adaçayı","грейпфрут, шалфей","grapefruit, sage"],"h":["vetiver, muskat qozu","ветивер, мускатный орех","vetiver, nutmeg"],"b":["palıd mamırı, kəhrəba","дубовый мох, амбра","oakmoss, amber"],"s":["Bütün fəsillər; gündüz və axşam","Всесезонный; день и вечер","All seasons; day & evening"],"d":["Kişilər üçün odunsu ətir. Açılışda qreypfrut və adaçayı, ürəyində vetiver və muskat qozu, bazasında isə palıd mamırı və kəhrəba hiss olunur. Universaldır: istənilən fəsildə, gündüz və axşam uyğundur.","Древесный аромат для мужчин. Начало — грейпфрут и шалфей; в сердце — ветивер и мускатный орех; в базе — дубовый мох и амбра. Универсален: подходит для любого сезона, днём и вечером.","Woody fragrance for men. It opens with grapefruit and sage, reveals vetiver and nutmeg in the heart and settles on oakmoss and amber. Versatile: suits any season, day or evening."]},{"f":["Şərq qurman","Восточный гурманский","Oriental Gourmand"],"t":["qara albalı, albalı likörü, acı badam","чёрная вишня, вишнёвый ликёр, горький миндаль","black cherry, cherry liqueur, bitter almond"],"h":["qızılgül, jasmin","роза, жасмин","rose, jasmine"],"b":["Peru balzamı, tonka paxlası, səndəl ağacı, vetiver, darçın","перуанский бальзам, бобы тонка, сандал, ветивер, корица","Peru balsam, tonka bean, sandalwood, vetiver, cinnamon"],"s":["Payız–qış; gündüz və axşam","Осень–зима; день и вечер","Autumn–winter; day & evening"],"d":["Badam və isti tonka ilə şirəli qara albalı və albalı likörü. Yaddaqalan iz buraxan şirin, cazibədar qurman ətir.","Сочная чёрная вишня и вишнёвый ликёр с миндалём и тёплыми бобами тонка. Сладкий, соблазнительный гурманский аромат с запоминающимся шлейфом.","Juicy black cherry and cherry liqueur with almond and warm tonka. A sweet, seductive gourmand that leaves a memorable trail."]},{"f":["Sitrus-aromatik","Цитрусовый ароматический","Citrus Aromatic"],"t":["mandarin, limon","мандарин, лимон","mandarin, lemon"],"h":["reyhan, nanə","базилик, мята","basil, mint"],"b":["vetiver, müşk","ветивер, мускус","vetiver, musk"],"s":["Yaz–yay; gündüz","Весна–лето; день","Spring–summer; daytime"],"d":["Kişi və qadınlar üçün sitrus-aromatik ətir. Açılışda mandarin və limon, ürəyində reyhan və nanə, bazasında isə vetiver və müşk hiss olunur. Ən yaxşı yaz və yay aylarında, gündüz açılır.","Цитрусовый ароматический аромат для мужчин и женщин. Начало — мандарин и лимон; в сердце — базилик и мята; в базе — ветивер и мускус. Лучше всего раскрывается весной и летом, в дневное время.","Citrus aromatic fragrance for men and women. It opens with mandarin and lemon, reveals basil and mint in the heart and settles on vetiver and musk. At its best in spring and summer, during the day."]},{"f":["Çiçəkli","Цветочный","Floral"],"t":["aldehidlər, çəhrayı istiot","альдегиды, розовый перец","aldehydes, pink pepper"],"h":["inciçiçəyi","ландыш","lily of the valley"],"b":["vanil, müşk","ваниль, мускус","vanilla, musk"],"s":["Bütün fəsillər; gündüz və axşam","Всесезонный; день и вечер","All seasons; day & evening"],"d":["Qadınlar üçün çiçəkli ətir. Açılışda aldehidlər və çəhrayı istiot, ürəyində inciçiçəyi, bazasında isə vanil və müşk hiss olunur. Universaldır: istənilən fəsildə, gündüz və axşam uyğundur.","Цветочный аромат для женщин. Начало — альдегиды и розовый перец; в сердце — ландыш; в базе — ваниль и мускус. Универсален: подходит для любого сезона, днём и вечером.","Floral fragrance for women. It opens with aldehydes and pink pepper, reveals lily of the valley in the heart and settles on vanilla and musk. Versatile: suits any season, day or evening."]},{"f":["Şərq ədviyyatlı","Восточный пряный","Oriental Spicy"],"t":["berqamot, çəhrayı istiot","бергамот, розовый перец","bergamot, pink pepper"],"h":["süsən, muskat qozu","ирис, мускатный орех","iris, nutmeg"],"b":["vanil, paçuli, kəhrəba","ваниль, пачули, амбра","vanilla, patchouli, amber"],"s":["Payız–qış; axşam","Осень–зима; вечер","Autumn–winter; evening"],"d":["Kişilər üçün şərq ədviyyatlı ətir. Açılışda berqamot və çəhrayı istiot, ürəyində süsən və muskat qozu, bazasında isə vanil, paçuli və kəhrəba hiss olunur. Payız, qış və axşam çıxışları üçün idealdır.","Восточный пряный аромат для мужчин. Начало — бергамот и розовый перец; в сердце — ирис и мускатный орех; в базе — ваниль, пачули и амбра. Идеален для осени, зимы и вечерних выходов.","Oriental spicy fragrance for men. It opens with bergamot and pink pepper, reveals iris and nutmeg in the heart and settles on vanilla, patchouli and amber. Ideal for autumn, winter and evenings out."]},{"f":["Şərq ədviyyatlı","Восточный пряный","Oriental Spicy"],"t":["hil, muskat qozu, zəfəran","кардамон, мускатный орех, шафран","cardamom, nutmeg, saffron"],"h":["kulfi, qızılgül, jasmin","кульфи, роза, жасмин","kulfi, rose, jasmine"],"b":["vanil, səndəl ağacı, kəhrəba","ваниль, сандал, амбра","vanilla, sandalwood, amber"],"s":["Payız–qış; axşam","Осень–зима; вечер","Autumn–winter; evening"],"d":["Kişilər üçün şərq ədviyyatlı ətir. Açılışda hil, muskat qozu və zəfəran, ürəyində kulfi və qızılgül, bazasında isə vanil, səndəl ağacı və kəhrəba hiss olunur. Payız, qış və axşam çıxışları üçün idealdır.","Восточный пряный аромат для мужчин. Начало — кардамон, мускатный орех и шафран; в сердце — кульфи и роза; в базе — ваниль, сандал и амбра. Идеален для осени, зимы и вечерних выходов.","Oriental spicy fragrance for men. It opens with cardamom, nutmeg and saffron, reveals kulfi and rose in the heart and settles on vanilla, sandalwood and amber. Ideal for autumn, winter and evenings out."]},{"f":["Dəri","Кожаный","Leather"],"t":["hil","кардамон","cardamom"],"h":["dəri, jasmin","кожа, жасмин","leather, jasmine"],"b":["kəhrəba, mamır, paçuli","амбра, мох, пачули","amber, moss, patchouli"],"s":["Payız–qış; axşam","Осень–зима; вечер","Autumn–winter; evening"],"d":["Kişilər üçün dəri ətir. Açılışda hil, ürəyində dəri və jasmin, bazasında isə kəhrəba, mamır və paçuli hiss olunur. Payız, qış və axşam çıxışları üçün idealdır.","Кожаный аромат для мужчин. Начало — кардамон; в сердце — кожа и жасмин; в базе — амбра, мох и пачули. Идеален для осени, зимы и вечерних выходов.","Leather fragrance for men. It opens with cardamom, reveals leather and jasmine in the heart and settles on amber, moss and patchouli. Ideal for autumn, winter and evenings out."]},{"f":["Odunsu","Древесный","Woody"],"t":["gül ağacı, hil, istiot","розовое дерево, кардамон, перец","rosewood, cardamom, pepper"],"h":["ud ağacı, səndəl ağacı, vetiver","уд, сандал, ветивер","oud, sandalwood, vetiver"],"b":["tonka paxlası, vanil, kəhrəba","бобы тонка, ваниль, амбра","tonka bean, vanilla, amber"],"s":["Payız–qış; gündüz və axşam","Осень–зима; день и вечер","Autumn–winter; day & evening"],"d":["Səndəl ağacı, hil və vanillə yumşaldılmış zərif ud. Nəcib və sakit — ud ətirləri ilə tanışlıq üçün əla seçim.","Мягкий, отшлифованный уд, смягчённый сандалом, кардамоном и ванилью. Благородный и спокойный — отличное знакомство с ароматами уда.","A smooth, polished oud softened by sandalwood, cardamom and vanilla. Noble and calm — a great introduction to oud fragrances."]},{"f":["Çiçəkli","Цветочный","Floral"],"t":["çəhrayı istiot","розовый перец","pink pepper"],"h":["qızılgül","роза","rose"],"b":["paçuli, vetiver","пачули, ветивер","patchouli, vetiver"],"s":["Yaz–payız; gündüz","Весна–осень; день","Spring–autumn; daytime"],"d":["Kişi və qadınlar üçün çiçəkli ətir. Açılışda çəhrayı istiot, ürəyində qızılgül, bazasında isə paçuli və vetiver hiss olunur. Yaz və payız üçün, xüsusən gündüz uyğundur.","Цветочный аромат для мужчин и женщин. Начало — розовый перец; в сердце — роза; в базе — пачули и ветивер. Подходит для весны и осени, особенно днём.","Floral fragrance for men and women. It opens with pink pepper, reveals rose in the heart and settles on patchouli and vetiver. Suits spring and autumn, especially in the daytime."]},{"f":["Çiçəkli-kəhrəba","Цветочный амбровый","Floral Amber"],"t":["berqamot, püstə, hil","бергамот, фисташка, кардамон","bergamot, pistachio, cardamom"],"h":["ilanq-ilanq, jasmin","иланг-иланг, жасмин","ylang-ylang, jasmine"],"b":["hindistan cevizi, kəhrəba, benzoin","кокос, амбра, бензоин","coconut, amber, benzoin"],"s":["Yaz–yay; gündüz","Весна–лето; день","Spring–summer; daytime"],"d":["Qadınlar üçün çiçəkli-kəhrəba ətir. Açılışda berqamot, püstə və hil, ürəyində ilanq-ilanq və jasmin, bazasında isə hindistan cevizi, kəhrəba və benzoin hiss olunur. Ən yaxşı yaz və yay aylarında, gündüz açılır.","Цветочный амбровый аромат для женщин. Начало — бергамот, фисташка и кардамон; в сердце — иланг-иланг и жасмин; в базе — кокос, амбра и бензоин. Лучше всего раскрывается весной и летом, в дневное время.","Floral amber fragrance for women. It opens with bergamot, pistachio and cardamom, reveals ylang-ylang and jasmine in the heart and settles on coconut, amber and benzoin. At its best in spring and summer, during the day."]},{"f":["Şərq ədviyyatlı","Восточный пряный","Oriental Spicy"],"t":["tütün yarpağı, ədviyyatlar","табачный лист, специи","tobacco leaf, spices"],"h":["vanil, kakao, tonka paxlası","ваниль, какао, бобы тонка","vanilla, cacao, tonka bean"],"b":["quru meyvələr, odunsu notlar","сухофрукты, древесные ноты","dried fruits, woody notes"],"s":["Payız–qış; axşam","Осень–зима; вечер","Autumn–winter; evening"],"d":["İsti və bürüyən: tütün yarpağı, kremli vanil, kakao və quru meyvələr. Soyuq axşamlar üçün rahat, zəngin ətir.","Тёплый и обволакивающий: табачный лист, сливочная ваниль, какао и сухофрукты. Уютный, насыщенный аромат для холодных вечеров.","Warm and enveloping: tobacco leaf, creamy vanilla, cocoa and dried fruits. A cosy, rich scent for cold evenings."]},{"f":["Dəri","Кожаный","Leather"],"t":["zəfəran, moruq, kəklikotu","шафран, малина, тимьян","saffron, raspberry, thyme"],"h":["olibanum, jasmin","олибанум, жасмин","olibanum, jasmine"],"b":["dəri, zamşa, kəhrəba","кожа, замша, амбра","leather, suede, amber"],"s":["Payız–qış; axşam","Осень–зима; вечер","Autumn–winter; evening"],"d":["Kişi və qadınlar üçün dəri ətir. Açılışda zəfəran, moruq və kəklikotu, ürəyində olibanum və jasmin, bazasında isə dəri, zamşa və kəhrəba hiss olunur. Payız, qış və axşam çıxışları üçün idealdır.","Кожаный аромат для мужчин и женщин. Начало — шафран, function famKey(info){ if(!info) return "none"; const f=info.f[2];
  if(/Gourmand/i.test(f)) return "gourmand"; if(/Leather/i.test(f)) return "leather";
  if(/^(Oriental|Amber)/i.test(f)) return "oriental"; if(/^Floral/i.test(f)) return "floral";
  if(/Citrus|Aquatic|Fougère|Aromatic/i.test(f)) return "fresh"; return "woody"; }
function seaKey(info){ if(!info) return ""; const s=info.s[2];
  return s.startsWith("All")?"ALL":s.startsWith("Spring–summer")?"WARM":s.startsWith("Spring–autumn")?"SPRING":s.includes("evening")&&s.includes("day")?"COLDDAY":"COLD"; }
P.forEach(p=>{p.fk=famKey(p.inf); p.sk=seaKey(p.inf);
  p.short=p.n.startsWith(p.b+" ")?p.n.slice(p.b.length+1):p.n;
  p.hay=(p.n+" "+(p.inf?[0,1,2].map(l=>[p.inf.f[l],p.inf.t[l],p.inf.h[l],p.inf.b[l]].join(" ")).join(" "):"")).toLowerCase();});

function filtered(){
  const words=st.q.toLowerCase().split(/\s+/).filter(Boolean);
  let r=P.filter(p=>(!st.g||p.g===st.g)&&(!st.fam||p.fk===st.fam)&&(!st.season||p.sk===st.season)&&(!st.brand||p.b===st.brand)&&words.every(w=>p.hay.includes(w)));
  if(st.sort===1) r.sort((a,b)=>(a.p||99)-(b.p||99)); else if(st.sort===2) r.sort((a,b)=>b.p-a.p);
  return r;

  const p=P[id]; const i=p.inf;
  $("modal").innerHTML=`<button class="x" onclick="closeAll()">×</button><div class="mh">${ph(p)}<div class="mbody">
   <div class="brand" lang="en">${esc(p.b)}</div><div class="name">${esc(p.short)}</div>
   <div class="tags"><span class="tag">${T[p.g][L]}</span>${i?`<span class="tag">${esc(i.f[L])}</span><span class="tag">${esc(i.s[L])}</span>`:""}</div>
   ${i?`<dl class="pyr">${i.t[L]?`<div><dt>${t("top")}</dt><dd style="margin:0">${esc(i.t[L])}</dd></div>`:""}
        ${i.h[L]?`<div><dt>${t("heart")}</dt><dd style="margin:0">${esc(i.h[L])}</dd></div>`:""}
        ${i.b[L]?`<div><dt>${t("base")}</dt><dd style="margin:0">${esc(i.b[L])}</dd></div>`:""}</dl>
        <p class="desc">${esc(i.d[L])}</p>`:`<div class="nodata">${t("nodata")}</div>`}
   <div class="buy">
     <div class="qty"><button onclick="step(-1)">−</button><input id="gq" type="number" min="1" value="${DEFAULT_GRAMS}" oninput="calc(${id})"><em>${t("g")}</em><button onclick="step(1)">+</button></div>
     <span class="total" id="tot"></span>
     <button class="primary" onclick="add(${id})">${t("add")}</button>
   </div></div></div>`;
  window._cur=id; calc(id);
  $("modal").classList.add("show"); $("ov").classList.add("show");
}
function step(d){const e=$("gq");e.value=Math.max(1,(+e.value||0)+d);calc(window._cur);}
function calc(id){const g=Math.max(0,+$("gq").value||0);const p=P[id];$("tot").textContent=p.p>0?money(g*p.p):"";}
function add(id){const g=Math.max(1,Math.round(+$("gq").value||DEFAULT_GRAMS));const ex=cart.find(c=>c.id===id);
  if(ex) ex.g+=g; else cart.push({id,g}); save(); cartUI(); toast(t("added")); closeAll();}
function cartUI(){
  $("cartN").textContent=cart.length;
  if(!cart.length){$("lines").innerHTML=`<div class="empty">${t("cartEmpty")}</div>`;$("foot").innerHTML="";return;}
  $("lines").innerHTML=cart.map((c,k)=>{const p=P[c.id];return `<div class="line"><div><div class="br" lang="en">${esc(p.b)}</div><div class="nm">${esc(p.short)}</div>
   <button class="rm" onclick="rm(${k})">${t("remove")}</button></div>
   <div style="text-align:right"><div class="qty"><button onclick="cq(${k},-1)">−</button><input type="number" min="1" value="${c.g}" onchange="sq(${k},this.value)"><em>${t("g")}</em><button onclick="cq(${k},1)">+</button></div>
   <div style="margin-top:6px;font-weight:600">${p.p>0?money(c.g*p.p):t("ask")}</div></div></div>`}).join("");
  $("foot").innerHTML=`<div class="sum"><span>${t("total")}</span><span>${money(sum())}</span></div>
   <div class="form"><input id="fn" placeholder="${t("name")}"><input id="fp" type="tel" placeholder="${t("phone")}"><input id="fa" placeholder="${t("addr")}"><textarea id="fc" placeholder="${t("note")}"></textarea></div>
   <div class="err" id="ferr"></div><button class="primary" onclick="order()">${t("order")}</button><div id="res"></div>`;
}
const sum=()=>cart.reduce((s,c)=>s+c.g*P[c.id].p,0);
function rm(k){cart.splice(k,1);save();cartUI();}
function cq(k,d){cart[k].g=Math.max(1,cart[k].g+d);save();cartUI();}
function sq(k,v){cart[k].g=Math.max(1,Math.round(+v||1));save();cartUI();}
function order(){
  const n=$("fn").value.trim(),ph=$("fp").value.trim(),a=$("fa").value.trim(),c=$("fc").value.trim();
  if(!n||!ph||!a){$("ferr").textContent=t("need");return;} $("ferr").textContent="";
  const txt=[t("orderHead"),"",...cart.map((x,i)=>{const p=P[x.id];return `${i+1}. ${p.n} — ${x.g} ${t("g")}${p.p>0?" × "+money(p.p)+" = "+money(x.g*p.p):" ("+t("ask")+")"}`}),
    "",`${t("total")}: ${money(sum())}`,"",`${t("name")}: ${n}`,`${t("phone")}: ${ph}`,`${t("addr")}: ${a}`].concat(c?[`${t("note")}: ${c}`]:[]).join("\n");
  window._txt=txt;
  $("res").innerHTML=`<p style="font-size:13.5px;margin:6px 0">${t("ready")}</p><div class="done">${esc(txt)}</div>
   <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">${WHATSAPP?`<a class="primary" style="text-decoration:none" href="https://wa.me/${WHATSAPP}?text=${encodeURIComponent(txt)}" target="_blank" rel="noopener">${t("sendWa")}</a>`:""}
   <button class="ghost" onclick="cp()">${t("copy")}</button></div>${WHATSAPP?"":`<p style="font-size:12.5px;color:var(--muted)">${t("noWa")}</p>`}`;
}
function cp(){navigator.clipboard.writeText(window._txt).then(()=>toast(t("copied")),()=>{});}
function closeAll(){$("modal").classList.remove("show");$("drawer").classList.remove("show");$("ov").classList.remove("show");}
function resetAll(){Object.assign(st,{q:"",g:"",fam:"",season:"",brand:"",sort:0,shown:48});$("q").value="";staticText();render();scrollTo(0,0);}

$("q").addEventListener("input",e=>{st.q=e.target.value;st.shown=48;render();});
$("gChips").addEventListener("click",e=>{const b=e.target.closest("[data-g]");if(!b)return;st.g=st.g===b.dataset.g?"":b.dataset.g;st.shown=48;staticText();render();});
$("famChips").addEventListener("click",e=>{const b=e.target.closest("[data-f]");if(!b)return;st.fam=st.fam===b.dataset.f?"":b.dataset.f;st.shown=48;staticText();render();});
$("season").onchange=e=>{st.season=e.target.value;st.shown=48;render();};
$("brand").onchange=e=>{st.brand=e.target.value;st.shown=48;render();};
$("sort").onchange=e=>{st.sort=+e.target.value;render();};
$("more").onclick=()=>{st.shown+=48;render();};
$("grid").addEventListener("click",e=>{const c=e.target.closest(".card");if(c)openP(+c.dataset.id);});
$("langs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;L=+b.dataset.l;save();staticText();render();cartUI();if($("modal").classList.contains("show"))openP(window._cur);});
$("openCart").onclick=()=>{cartUI();$("drawer").classList.add("show");$("ov").classList.add("show");};
$("closeCart").onclick=closeAll; $("ov").onclick=closeAll;
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeAll();});
staticText(); render(); cartUI();
</script>
</body>
</html>
